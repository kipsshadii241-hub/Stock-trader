<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KQ</title><style>body{margin:0;background:#0E0E0E;color:#fff;font-family:system-ui} .tab{flex:1;padding:10px;text-align:center;border-radius:20px;background:#1A1A1A;color:#666;border:1px solid #333} .on{background:#2A1815!important;border:1px solid #FF6444!important;color:#FF6444!important} .card{margin:10px;background:#161616;border:1px solid #222;border-radius:12px;padding:10px} .tbtn{background:#1A1A1A;border:1px solid #333;border-radius:14px;padding:14px}</style></head><body>
<div style="padding:12px;background:#141414;display:flex;justify-content:space-between"><b>KQbinary</b><span style="background:#2A1515;border:1px solid #FF4444;padding:6px 12px;border-radius:20px">R $<span id="bal">0.00</span></span></div>
<div style="display:flex;gap:6px;padding:10px"><div id="t0" class="tab" onclick="setTab(0)">Matches</div><div id="t1" class="tab" onclick="setTab(1)">Even/Odd</div><div id="t2" class="tab on" onclick="setTab(2)">Over/Under</div></div>
<div class="card"><canvas id="ch" width="300" height="110" style="width:100%"></canvas><div id="bars" style="display:flex;gap:3px;height:24px;margin-top:8px"></div><div id="digits" style="display:flex;gap:4px;margin-top:8px"></div></div>
<div id="box" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px"></div>
<script>
var bal=Number(localStorage.getItem('rb')||0),sel=5,tab=2,data=[];for(var i=0;i<60;i++)data.push(9450+Math.random());
document.getElementById('bal').innerText=bal.toFixed(2);
var c=document.getElementById('ch'),x=c.getContext('2d');
function draw(){x.clearRect(0,0,300,110);x.beginPath();x.strokeStyle='#fff';x.lineWidth=2;for(var i=0;i<data.length;i++){var px=i*5,py=55-(data[i]-9450)*8;if(i==0)x.moveTo(px,py);else x.lineTo(px,py);}x.stroke();}
setInterval(function(){data.push(9450+Math.random()*2);if(data.length>60)data.shift();draw();},800);
function setTab(t){tab=t;for(var i=0;i<3;i++)document.getElementById('t'+i).className=t==i?'tab on':'tab';render();}
function render(){var d='';for(var i=0;i<10;i++)d+='<div onclick="sel='+i+';render()" style="flex:1;padding:8px 0;text-align:center;border-radius:8px;'+(i==sel?'background:#2A1815;color:#FF6444;border:1px solid #FF6444':'background:#1E1E1E')+'">'+i+'</div>';document.getElementById('digits').innerHTML=d;
var b='';for(var j=0;j<10;j++){var h=6+Math.random()*18;b+='<div style="flex:1;height:'+h+'px;background:'+(j==sel?'#FF6444':'#333')+';border-radius:3px"></div>';}document.getElementById('bars').innerHTML=b;
var box=document.getElementById('box');
if(tab==2)box.innerHTML='<button onclick="trade()" class="tbtn"><div style="display:flex;justify-content:space-between"><b style="color:#FF6444">Over '+sel+'</b><span>$19.80</span></div><small style="color:#666">98% Payout</small></button><button onclick="trade()" class="tbtn"><div style="display:flex;justify-content:space-between"><b style="color:#FF6B6B">Under '+sel+'</b><span>$15.83</span></div><small style="color:#666">58.30% Payout</small></button>';
else if(tab==1)box.innerHTML='<button onclick="trade()" class="tbtn">Even $1.95</button><button onclick="trade()" class="tbtn">Odd $1.95</button>';
else box.innerHTML='<button onclick="trade()" class="tbtn">Matches '+sel+' $9.00</button><button onclick="trade()" class="tbtn">Differs '+sel+' $1.09</button>';
}
function trade(){if(bal<10){bal+=10;}bal-=10;if(Math.random()>0.5)bal+=18;document.getElementById('bal').innerText=bal.toFixed(2);localStorage.setItem('rb',bal);}
render();draw();
</script></body></html>
