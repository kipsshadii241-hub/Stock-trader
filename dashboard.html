<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KQ FIXED</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:system-ui;padding-bottom:80px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#111;border-bottom:1px solid #222}
.bal{background:#1e1e1e;padding:6px 12px;border-radius:20px;border:1px solid #333}
.dep{background:#ff8a2a;color:#000;padding:8px 16px;border-radius:20px;font-weight:900;border:0}
.tabs{display:flex;gap:8px;padding:10px}.tab{flex:1;padding:10px;text-align:center;border-radius:20px;background:#151515;color:#777;border:1px solid #222}.tab.on{background:#ff8a2a;color:#000;font-weight:900}
.card{margin:0 10px;background:#111;border:1px solid #222;border-radius:14px;padding:10px}
canvas{width:100%;height:150px;background:#0e0e0e;border-radius:10px;display:block;margin-top:8px}
.trade{display:flex;gap:8px;margin:10px}.tBtn{flex:1;background:#151515;border:1px solid #222;border-radius:12px;padding:14px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:99;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.box{width:100%;max-width:380px;background:#1a1a1a;border:1px solid #333;border-radius:18px;padding:18px}
.depBtn{width:100%;background:#ff8a2a;color:#000;padding:15px;border:0;border-radius:24px;font-weight:900;margin-top:14px}
.inp{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:10px;padding:14px;color:#fff;font-size:16px;margin-top:8px}
.chip{padding:8px 14px;background:#151515;border:1px solid #222;border-radius:18px;margin:4px;display:inline-block}.chip.on{background:#ff8a2a;color:#000;font-weight:900}
</style></head><body>
<div class="top"><div style="display:flex;gap:8px;align-items:center"><span style="background:#ff8a2a;color:#000;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900">KQ</span><b>KQbinary</b><div class="bal" onclick="document.getElementById('accPop').style.display=document.getElementById('accPop').style.display=='block'?'none':'block'">R $<span id="bal">104.00</span> ▼<div id="accPop" style="display:none;position:absolute;top:50px;left:10px;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:8px;min-width:200px;z-index:50"><div style="padding:10px">🟢 Real: $<span id="rBal">104</span></div><div style="padding:10px" onclick="demo()">🔴 Demo: $10000</div></div></div></div><button class="dep" onclick="openDep()">Deposit</button></div>
<div class="tabs"><div class="tab on" onclick="setTab(0)">Matches/Differs</div><div class="tab" onclick="setTab(1)">Even/Odd</div><div class="tab" onclick="setTab(2)">Over/Under</div></div>
<div class="card"><div style="display:flex;justify-content:space-between;font-size:11px;color:#888"><span>Volatility 10 (1s) Index</span><span style="background:#ff8a2a;color:#000;padding:3px 8px;border-radius:6px;font-weight:900" id="price">9444.93</span></div><canvas id="cv" width="360" height="150"></canvas><div id="bars" style="display:flex;gap:3px;margin-top:10px;height:30px;align-items:end"></div><div id="digits" style="display:flex;gap:4px;margin-top:8px"></div></div>
<div class="trade"><div class="tBtn" onclick="trade(0)"><b>Match</b> <span style="color:#ff8a2a" id="p0">$19.5</span></div><div class="tBtn" onclick="trade(1)"><b>Differ</b> <span style="color:#ff8a2a" id="p1">$10.56</span></div></div>
<div style="margin:10px;background:#111;border:1px solid #222;border-radius:10px;padding:10px;font-size:11px" id="hist">Graph moving fixed!</div>
<div style="position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px"><div onclick="openWith()" style="color:#666">Withdraw</div><div style="color:#ff8a2a" onclick="openDep()">Deposit</div></div>

<div class="modal" id="depM"><div class="box"><div style="display:flex;justify-content:space-between"><b>Deposit MPESA</b><span onclick="closeDep()">✕</span></div><input class="inp" id="mpAmt" type="number" value="100" oninput="upd()"><div style="margin-top:10px"><span class="chip on" onclick="setMp(10)">$10</span><span class="chip" onclick="setMp(25)">$25</span><span class="chip" onclick="setMp(100)">$100</span></div><small id="kes" style="color:#888">KES 12955.00</small><input class="inp" id="mpPhone" value="254712681370"><button class="depBtn" id="mpBtn" onclick="push()">Deposit $100.00 - PUSH STK</button><div id="mpStatus" style="display:none;margin-top:12px;background:#111;padding:12px;border-radius:10px"><div id="mpTxt" style="color:#ff8a2a;font-size:12px"></div><div style="margin-top:8px;background:#222;height:8px;border-radius:4px"><div id="mpBar" style="width:0%;height:100%;background:#ff8a2a"></div></div></div></div></div>

<div class="modal" id="withM"><div class="box"><div style="display:flex;justify-content:space-between"><b>Withdraw</b><span onclick="closeWith()">✕</span></div><input class="inp" id="wAmt" value="10" type="number"><input class="inp" id="wPhone" value="254712681370"><button class="depBtn" onclick="withdraw()">Withdraw Now</button><div id="wStat" style="display:none;margin-top:10px;background:#111;padding:10px;border-radius:8px;color:#ff8a2a"></div></div></div>

<script>
var real=104, demo=10000, acc='real', stake=10, sel=5, last=5;
var data=[], hist=[];
for(var i=0;i<80;i++){ data.push(9444+Math.sin(i/6)*4+Math.random()*2); hist.push(Math.floor(Math.random()*10)); }
var cv=document.getElementById('cv'); var ctx=cv.getContext('2d');
function draw(){
 ctx.clearRect(0,0,360,150);
 ctx.beginPath(); ctx.strokeStyle='#fff'; ctx.lineWidth=2;
 for(var i=0;i<data.length;i++){ var x=i*4.5; var y=75-(data[i]-9444)*7; if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
 ctx.stroke();
}
function render(){
 var b=acc=='real'?real:demo;
 document.getElementById('bal').innerText=b.toFixed(2);
 document.getElementById('rBal').innerText=real.toFixed(2);
 document.getElementById('price').innerText=data[data.length-1].toFixed(2);
 document.getElementById('p0').innerText='$'+(stake*1.9).toFixed(2);
 document.getElementById('p1').innerText='$'+(stake*1.1).toFixed(2);
 var counts=[0][0][0][0][0][0];
 for(var j=0;j<hist.length;j++) counts[hist[j]]++;
 var max=1; for(var k=0;k<10;k++) if(counts[k]>max) max=counts[k];
 var bHtml=''; for(var i=0;i<10;i++){ var h=6+counts[i]/max*24; bHtml+='<div style="flex:1;background:'+(i==sel?'#ff8a2a':'#2a2a2a')+';height:'+h+'px;border-radius:4px;text-align:center"><small style="font-size:8px;color:#aaa">'+counts[i]+'</small></div>'; }
 document.getElementById('bars').innerHTML=bHtml;
 var dHtml=''; for(var i=0;i<10;i++) dHtml+='<div style="flex:1;text-align:center;padding:8px;background:'+(i==sel?'#ff8a2a':'#1e1e1e')+';border-radius:6px;color:'+(i==sel?'#000':'#888')+';border:1px solid #333" onclick="sel='+i+';render()">'+i+'</div>';
 document.getElementById('digits').innerHTML=dHtml;
}
function setTab(t){ render(); }
function openDep(){ document.getElementById('depM').classList.add('on'); }
function closeDep(){ document.getElementById('depM').classList.remove('on'); }
function setMp(v){ document.getElementById('mpAmt').value=v; upd(); }
function upd(){ var v=document.getElementById('mpAmt').value||0; document.getElementById('kes').innerText='KES '+(v*129.55).toFixed(2)+' @ 129.55'; document.getElementById('mpBtn').innerText='Deposit $'+v+' - PUSH STK'; }
function push(){
 var v=parseFloat(document.getElementById('mpAmt').value)||0;
 var phone=document.getElementById('mpPhone').value;
 var s=document.getElementById('mpStatus');
 var txt=document.getElementById('mpTxt');
 var bar=document.getElementById('mpBar');
 s.style.display='block';
 txt.innerHTML='📱 STK PUSH SENT to '+phone+'<br>Amount KES '+Math.round(v*129.55)+'<br><br>⏳ Check phone, enter PIN...';
 bar.style.width='20%';
 document.getElementById('mpBtn').innerText='Pushing STK...';
 var p=20; var iv=setInterval(function(){ p+=15; bar.style.width=p+'%'; if(p>=80) clearInterval(iv); },400);
 setTimeout(function(){
  bar.style.width='100%';
  txt.innerHTML='✅ MPESA CONFIRMED!<br>Phone: '+phone+'<br>KES '+Math.round(v*129.55)+' Received<br>Code: QK'+Math.floor(Math.random()*9000000+1000000)+'<br><br>Updating balance...';
  setTimeout(function(){
   real+=v;
   localStorage.setItem('kq_real',String(real));
   render();
   closeDep();
   document.getElementById('hist').innerHTML='<div style="color:#ff8a2a">✅ DEPOSIT +$'+v+' MPESA '+phone+' → $'+real.toFixed(2)+'</div>'+document.getElementById('hist').innerHTML;
  },800);
 },2500);
}
function openWith(){ document.getElementById('depM').classList.remove('on'); document.getElementById('withM').classList.add('on'); }
function closeWith(){ document.getElementById('withM').classList.remove('on'); }
function withdraw(){
 var v=parseFloat(document.getElementById('wAmt').value)||0;
 var phone=document.getElementById('wPhone').value;
 var st=document.getElementById('wStat');
 if(v>real){ alert('Insufficient'); return; }
 st.style.display='block';
 st.innerHTML='⏳ Withdrawing $'+v+' to '+phone+'...';
 setTimeout(function(){
  real-=v;
  localStorage.setItem('kq_real',String(real));
  render();
  st.innerHTML='✅ Withdrawal SENT $'+v+' to '+phone+'<br>Code QW'+Math.floor(Math.random()*9000000+1000000);
  setTimeout(function(){ closeWith(); document.getElementById('hist').innerHTML='<div style="color:#5af">💸 WITHDRAW -$'+v+' → $'+real.toFixed(2)+'</div>'+document.getElementById('hist').innerHTML; },1200);
 },1500);
}
function trade(which){ var b=acc=='real'?real:demo; if(b<stake){ openDep(); return; } var win=Math.random()>0.5; var nb=win?b+stake*0.9:b-stake; if(acc=='real'){ real=nb; localStorage.setItem('kq_real',String(real)); } else { demo=nb; localStorage.setItem('kq_demo',String(demo)); } document.getElementById('hist').innerHTML='<div style="color:'+(win?'#0f0':'#f55')+'">'+(win?'WIN':'LOSS')+' → $'+nb.toFixed(2)+'</div>'+document.getElementById('hist').innerHTML; render(); }
function demo(){ acc='demo'; render(); document.getElementById('accPop').style.display='none'; }
render(); draw();
setInterval(function(){ var f=9444+Math.sin(Date.now()/600)*5+(Math.random()-0.5)*2; data.push(f); if(data.length>80) data.shift(); last=Math.floor(Math.random()*10); hist.push(last); if(hist.length>70) hist.shift(); draw(); render(); },500);
</script>
</body></html>
