<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KQbinary FIXED</title><style>
*{box-sizing:border-box}body{margin:0;background:#0A0A0A;color:#fff;font-family:system-ui;padding-bottom:20px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#111;border-bottom:1px solid #222}.live{color:#0F0;font-size:12px}.bal{background:#1A1A1A;padding:6px 12px;border-radius:20px;border:1px solid #333}
.tabs{display:flex;gap:8px;padding:10px}.tab{flex:1;padding:10px;text-align:center;border-radius:20px;background:#151515;color:#777;border:1px solid #222}.tab.on{border-color:#FF6A00;color:#FF6A00;background:#2A1A10}
.card{margin:10px;background:#111;border:1px solid #222;border-radius:14px;padding:12px}.price{color:#FF6A00;font-weight:900}
canvas{width:100%;height:120px;background:#0F0F0F;border-radius:10px;margin-top:10px}
.bars{display:flex;gap:4px;height:20px;align-items:end;margin-top:10px}.bar{flex:1;background:#2A2A2A;border-radius:4px}
.digs{display:flex;gap:4px;margin-top:10px}.d{flex:1;padding:10px 0;text-align:center;background:#1C1C1C;border:1px solid #333;border-radius:8px}.d.on{background:#FF6A00;color:#000;border-color:#FF6A00;font-weight:900}
.trade{display:flex;gap:10px;margin:10px}.t{flex:1;background:#151515;border:1px solid #333;border-radius:12px;padding:14px}.t b{color:#FF6A00}
.auto{margin:10px;background:#FF6A00;color:#000;padding:14px;border-radius:24px;text-align:center;font-weight:900}
.stake{display:flex;justify-content:space-between;align-items:center;background:#151515;margin:10px;padding:12px;border-radius:12px}.chips{display:flex;gap:6px;padding:0 10px;overflow:auto}.chip{padding:8px 14px;background:#1A1A1A;border:1px solid #333;border-radius:20px;flex-shrink:0}.chip.on{border-color:#FF6A00;color:#FF6A00}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 20px;border-radius:20px;font-weight:900;display:none;z-index:999}.toast.on{display:block}
</style></head><body>
<div class="toast" id="toast"></div>
<div class="top"><b>KQbinary • <span class="live">● LIVE R_10</span></b><div class="bal">$<span id="bal">9908.80</span> • <span style="color:#0F0">● LIVE</span></div></div>
<div class="tabs"><div class="tab">Matches</div><div class="tab">Even/Odd</div><div class="tab on">Over/Under</div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><span class="price" id="vol">Volatility 10: 9449.12</span><span>Last Digit: <b id="ld">5</b></span></div><canvas id="cv" width="340" height="120"></canvas><div class="bars" id="bars"></div><div class="digs" id="digs"></div><div style="height:4px;background:#222;border-radius:10px;margin-top:8px"><div id="prog" style="height:100%;background:#FF6A00;width:50%"></div></div></div>
<div class="trade"><div class="t" onclick="trade('over')"><div style="display:flex;justify-content:space-between"><b id="overL">Over 5</b><span>$<span id="overP">19.80</span></span></div><small>98% Payout</small></div><div class="t" onclick="trade('under')"><div style="display:flex;justify-content:space-between"><b id="underL">Under 5</b><span>$<span id="underP">15.83</span></span></div><small>58.3% Payout</small></div></div>
<div class="auto" id="autoBtn" onclick="toggleAuto()">AUTO OFF</div>
<div class="stake"><button onclick="chg(-1)" style="width:40px;height:40px;background:#222;border:0;color:#fff;border-radius:10px">-</button><div style="text-align:center">STAKE<br><b>$<span id="stk">10</span></b></div><button onclick="chg(1)" style="width:40px;height:40px;background:#222;border:0;color:#fff;border-radius:10px">+</button></div>
<div class="chips"><div class="chip" onclick="setS(1,this)">$1</div><div class="chip" onclick="setS(5,this)">$5</div><div class="chip on" onclick="setS(10,this)">$10</div><div class="chip" onclick="setS(25,this)">$25</div><div class="chip" onclick="setS(50,this)">$50</div></div>
<script>
let bal=9908.80,stake=10,sel=5,last=5,auto=false,timer=null,profit=0,data=[];
for(let i=0;i<80;i++)data.push(9440+Math.sin(i/5)*5+Math.random()*2);
let cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function draw(){ctx.clearRect(0,0,340,120);ctx.beginPath();ctx.strokeStyle='#fff';ctx.lineWidth=2;for(let i=0;i<data.length;i++){let x=i*4.25,y=60-(data[i]-9445)*6;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();}
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000);}
function render(){document.getElementById('bal').innerText=bal.toFixed(2);document.getElementById('stk').innerText=stake;document.getElementById('ld').innerText=last;document.getElementById('vol').innerText='Volatility 10: '+data[data.length-1].toFixed(2);document.getElementById('overL').innerText='Over '+sel;document.getElementById('underL').innerText='Under '+sel;document.getElementById('overP').innerText=(stake*1.98).toFixed(2);document.getElementById('underP').innerText=(stake*1.583).toFixed(2);let b='';for(let i=0;i<10;i++)b+=`<div class="bar" style="height:${8+Math.random()*18}px;background:${i==last?'#FF6A00':'#333'}"></div>`;document.getElementById('bars').innerHTML=b;let d='';for(let i=0;i<10;i++)d+=`<div class="d ${i==sel?'on':''}" onclick="sel=${i};render()">${i}</div>`;document.getElementById('digs').innerHTML=d;document.getElementById('prog').style.width=(last*10+10)+'%';}
function trade(type){let win=type=='over'?last>sel:last<sel;if(bal<stake){toast('Low balance');return;}if(win){let pay=type=='over'?stake*0.98:stake*0.583;bal+=pay;toast('WIN '+type.toUpperCase()+' '+last+' +$'+pay.toFixed(2));}else{bal-=stake;toast('LOSS '+type.toUpperCase()+' '+last+' -$'+stake);}render();}
function toggleAuto(){auto=!auto;document.getElementById('autoBtn').innerText=auto?'■ STOP - RUNNING':'AUTO OFF';document.getElementById('autoBtn').style.background=auto?'#fff':'#FF6A00';if(auto){toast('AUTO STARTED Over '+sel);runAuto();}else{clearTimeout(timer);toast('AUTO STOPPED');}}
function runAuto(){if(!auto)return;trade('over');timer=setTimeout(runAuto,1500);}
function chg(v){stake=Math.max(1,stake+v);render();}function setS(v,el){stake=v;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');render();}
setInterval(()=>{let f=9445+Math.sin(Date.now()/600)*6+(Math.random()-0.5)*2;data.push(f);if(data.length>80)data.shift();last=Math.floor(Math.random()*10);draw();render();},600);
render();draw();
</script></body></html>
