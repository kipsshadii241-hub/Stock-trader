<!DOCTYPE html><html><body style="background:#000;color:#fff;font-family:sans-serif;padding:20px">
<h1>KQbinary TEST</h1>
<h2>Balance: $<span id="b">9938.80</span></h2>
<button onclick="trade('over')" style="padding:20px;background:#FF4444;border:0;border-radius:10px;margin:5px">OVER 5 $19.80</button>
<button onclick="trade('under')" style="padding:20px;background:#333;border:1px solid #fff;border-radius:10px;margin:5px">UNDER 5 $15.83</button>
<p>Last Digit: <b id="d">5</b></p>
<script>
let bal=9938.80;setInterval(()=>{document.getElementById('d').innerText=Math.floor(Math.random()*10)},800);
function trade(t){let d=Math.floor(Math.random()*10);let win=(t=='over'?d>5:d<5);if(win){bal+=9.8;alert('WIN digit '+d)}else{bal-=10;alert('LOSS digit '+d)}document.getElementById('b').innerText=bal.toFixed(2)}
</script>
</body></html>
