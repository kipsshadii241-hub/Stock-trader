<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KQbinary</title><style>*{box-sizing:border-box}body{margin:0;background:#0E0E0E;color:#fff;font-family:system-ui;padding-bottom:20px}.top{padding:12px;background:#141414;display:flex;justify-content:space-between;align-items:center}.bal{background:#2A1515;border:1px solid #FF4444;padding:6px 12px;border-radius:20px}.tab{flex:1;padding:10px;text-align:center;border-radius:20px;background:#1A1A1A;color:#666;border:1px solid #333;margin:0 3px}.on{background:#2A1815!important;border-color:#FF6444!important;color:#FF6444!important}.card{margin:10px;background:#161616;border:1px solid #222;border-radius:12px;padding:10px}.d{flex:1;padding:10px 0;text-align:center;border-radius:8px;background:#1E1E1E;border:1px solid #333}.chip{flex:1;background:#1A1A1A;border:1px solid #333;padding:10px;border-radius:10px;color:#fff}.tbtn{flex:1;background:#1A1A1A;border:1px solid #333;border-radius:12px;padding:14px;color:#fff}</style></head><body>
<div class="top"><b> KQ KQbinary</b><div class="bal">D $<span id="bal">9938.80</span></div></div>
<div style="display:flex;padding:10px"><div class="tab">Matches</div><div class="tab">Even/Odd</div><div class="tab on">Over/Under</div></div>
<div class="card"><canvas id="ch" width="300" height="100" style="width:100%"></canvas><div id="bars" style="display:flex;gap:2px;height:22px;margin-top:8px"></div><div id="digs" style="display:flex;gap:4px;margin-top:8px"></div><div style="height:4px;background:#333;border-radius:10px;margin-top:8px"><div style="width:58%;height:100%;background:#FF6444"></div></div></div>
<div style="display:flex;gap:8px;padding:10px"><button class="tbtn" onclick="go('over')"><b style="color:#FF6444">Over <span class="sv">5</span></b><br>$19.80<br><small style="color:#666">98% Payout</small></button><button class="tbtn" onclick="go('under')"><b style="color:#FF6B6B">Under <span class="sv">5</span></b><br>$15.83<br><small style="color:#666">58.3% Payout</small></button></div>
<div style="margin:10px;background:#FF6444;color:#000;padding:12px;border-radius:20px;text-align:center;font-weight:900">AUTO</div>
<div style="margin:10px;background:#161616;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center"><button onclick="cs(-1)" style="width:40px;height:40px;background:#222;border:0;color:#fff;border-radius:8px">-</button><div><small style="color:#888">STAKE</small><br><b>$ <span id="stk">10</span></b></div><button onclick="cs(1)" style="width:40px;height:40px;background:#222;border:0;color:#fff;border-radius:8px">+</button></div>
<div style="display:flex;gap:6px;padding:0 10px"><button onclick="ss(1)" class="chip">$1</button><button onclick="ss(5)" class="chip">$5</button><button onclick="ss(10)" class="chip" style="border-color:#FF6444;color:#FF6444">$10</button><button onclick="ss(25)" class="chip">$25</button><button onclick="ss(50)" class="chip">$50</button><button onclick="ss(100)" class="chip">$100</button></div>
<script>
var bal=9938.80,sel=5,stake=10,data=[];for(var i=0;i<50;i++)data.push(9450+Math.sin(i/4));
function $(id){return document.getElementById(id)}
var cv=$('ch'),ct=cv.getContext('2d');
function draw(){ct.clearRect(0,0,300,100);ct.beginPath();ct.strokeStyle='#fff';ct.lineWidth=2;for(var i=0;i<data.length;i++){var x=i*6,y=50-(data[i]-9450)*10;if(i==0)ct.moveTo(x,y);else ct.lineTo(x,y);}ct.stroke();}
setInterval(function(){data.push(9450+Math.sin(Date.now()/500)+Math.random());if(data.length>50)data.shift();draw();},700);
function render(){var h='';for(var i=0;i<10;i++){h+='<div class="d" style="'+(i==sel?'background:#2A1815;color:#FF6444;border-color:#FF6444':'')+'" onclick="sel='+i+';document.querySelectorAll(\".sv\").forEach(e=>e.innerText='+i+');render()">'+i+'</div>';}$('digs').innerHTML=h;
var b='';for(var j=0;j<10;j++)b+='<div style="flex:1;height:'+(6+Math.random()*16)+'px;background:'+(j==sel?'#FF6444':'#333')+';border-radius:3px"></div>';$('bars').innerHTML=b;}
function cs(v){stake=Math.max(1,stake+v);$('stk').innerText=stake;}
function ss(v){stake=v;$('stk').innerText=v;}
function go(t){if(bal<stake){alert('No balance');return;}bal-=stake;$('bal').innerText=bal.toFixed(2);var d=Math.floor(Math.random()*10);setTimeout(function(){var win=(t=='over'?d>sel:d<sel);if(win){var p=t=='over'?stake*0.98:stake*0.583;bal+=stake+p;$('bal').innerText=bal.toFixed(2);alert('WIN! Last digit '+d+' +$'+p.toFixed(2));}else{alert('LOSS! Last digit '+d);} },600);}
render();draw();
</script></body></html>
