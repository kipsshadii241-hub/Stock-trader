<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KQbinary LIVE FIXED</title><style>
*{box-sizing:border-box}body{margin:0;background:#0A0A0A;color:#fff;font-family:system-ui}
.top{display:flex;justify-content:space-between;padding:12px;background:#111;border-bottom:1px solid #222}
.live{color:#00FF66}.bal{background:#222;padding:6px 12px;border-radius:20px;border:1px solid #333;font-size:13px}
.card{margin:12px;background:#121212;border-radius:14px;padding:12px;border:1px solid #222}
canvas{width:100%;height:140px;background:#0E0E0E;border-radius:10px;display:block;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{flex:1;padding:8px;text-align:center;border-radius:20px;background:#1A1A1A;color:#666;border:1px solid #222}.tab.on{border-color:#FF6A00;color:#FF6A00;background:#2A1A0F}
.row{display:flex;gap:4px;margin-top:10px}.bar{flex:1;height:20px;border-radius:4px;background:#333}.bar.on{background:#FF6A00}
.digs{display:flex;gap:4px;margin-top:8px}.d{flex:1;text-align:center;padding:8px 0;background:#1A1A1A;border:1px solid #333;border-radius:8px}.d.on{background:#FF6A00;color:#000;font-weight:900}
.trade{display:flex;gap:10px;margin:12px}.btn{flex:1;background:#1A1A1A;border:1px solid #333;border-radius:12px;padding:12px}.btn b{color:#FF6A00}
.auto{background:#FF6A00;color:#000;text-align:center;padding:14px;border-radius:24px;font-weight:900;margin:12px}
.stake{display:flex;justify-content:space-between;align-items:center;background:#151515;margin:12px;padding:12px;border-radius:12px}
</style></head><body>
<div class="top"><b>KQbinary • <span class="live">● LIVE R_10</span></b><div class="bal">$<span id="bal">54.55</span> • <span class="live">● LIVE</span></div></div>
<div class="card">
<div class="tabs"><div class="tab">Matches</div><div class="tab">Even/Odd</div><div class="tab on">Over/Under</div></div>
<div style="display:flex;justify-content:space-between"><span id="vol" style="color:#FF6A00;font-weight:900">Volatility 10: 9449.22</span><span>Last Digit: <b id="last">5</b></span></div>
<canvas id="c" width="340" height="140"></canvas>
<div class="row" id="bars"></div>
<div class="digs" id="digs"></div>
<div style="height:4px;background:#222;border-radius:10px;margin-top:10px"><div id="fill" style="height:100%;background:#FF6A00;width:60%"></div></div>
</div>
<div class="trade"><div class="btn" onclick="trade('over')"><div style="display:flex;justify-content:space-between"><b id="oL">Over 5</b><span>$<span id="oP">19.80</span></span></div><small>98% Payout</small></div><div class="btn" onclick="trade('under')"><div style="display:flex;justify-content:space-between"><b id="uL">Under 5</b><span>$<span id="uP">15.83</span></span></div><small>58.3% Payout</small></div></div>
<div class="auto" id="autoBtn" onclick="toggleAuto()">AUTO OFF</div>
<div class="stake"><button onclick="stake=Math.max(1,stake-1);render()" style="width:40px;height:40px;background:#222;border:0;color:#fff;border-radius:10px">-</button><div style="text-align:center">STAKE<br><b>$<span id="stk">10</span></b></div><button onclick="stake++;render()" style="width:40px;height:40px;background:#222;border:0;color:#fff;border-radius:10px">+</button></div>
<div style="display:flex;gap:6px;padding:0 12px"><div style="padding:8px 14px;background:#151515;border:1px solid #333;border-radius:20px">$1</div><div style="padding:8px 14px;background:#151515;border:1px solid #333;border-radius:20px">$5</div><div style="padding:8px 14px;background:#2A1A0F;border:1px solid #FF6A00;color:#FF6A00;border-radius:20px">$10</div><div style="padding:8px 14px;background:#151515;border:1px solid #333;border-radius:20px">$25</div><div style="padding:8px 14px;background:#151515;border:1px solid #333;border-radius:20px">$50</div></div>
<script>
let bal=54.55,stake=10,sel=5,last=5,data=[],auto=false,timer=null;
for(let i=0;i<80;i++) data.push(9440+Math.sin(i/8)*4+Math.random()*2);
let cv=document.getElementById('c'),ctx=cv.getContext('2d');
function draw(){ctx.clearRect(0,0,340,140);ctx.beginPath();ctx.strokeStyle='#fff';ctx.lineWidth=2;for(let i=0;i<data.length;i++){let x=i*4.25,y=70-(data[i]-9445)*7;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();}
function render(){
 document.getElementById('bal').innerText=bal.toFixed(2);
 document.getElementById('stk').innerText=stake;
 document.getElementById('last').innerText=last;
 document.getElementById('vol').innerText='Volatility 10: '+data[data.length-1].toFixed(2);
 document.getElementById('oL').innerText='Over '+sel;document.getElementById('uL').innerText='Under '+sel;
 document.getElementById('fill').style.width=(last*10+10)+'%';
 let b='';for(let i=0;i<10;i++) b+=`<div class="bar ${i==last?'on':''}"></div>`;document.getElementById('bars').innerHTML=b;
 let d='';for(let i=0;i<10;i++) d+=`<div class="d ${i==sel?'on':''}" onclick="sel=${i};render()">${i}</div>`;document.getElementById('digs').innerHTML=d;
}
function trade(t){let win=t=='over'?last>sel:last<sel;if(win) bal+=t=='over'?stake*0.98:stake*0.583;else bal-=stake;render();}
function toggleAuto(){auto=!auto;document.getElementById('autoBtn').innerText=auto?'■ STOP':'AUTO OFF';document.getElementById('autoBtn').style.background=auto?'#fff':'#FF6A00';if(auto){(function l(){if(!auto) return;trade('over');timer=setTimeout(l,1200)})()}else clearTimeout(timer)}
setInterval(()=>{let f=9445+Math.sin(Date.now()/700)*5+(Math.random()-0.5)*2;data.push(f);if(data.length>80)data.shift();last=Math.floor(Math.random()*10);draw();render();},500);
render();draw();
</script>
</body></html>
