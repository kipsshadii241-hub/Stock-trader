<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RQPtrade - Real MPESA</title>
<style>
body{background:#0a0e12;color:white;font-family:sans-serif;margin:0}
.header{display:flex;justify-content:space-between;padding:15px;background:#111}
.balance{color:#0f0;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-box{background:#1a1a1a;padding:25px;border-radius:12px;width:90%;max-width:350px}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #333;background:#222;color:white;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}
.btn-red{background:#8b0000;color:white}
.btn-green{background:#0f0;color:black;margin-top:10px}
.trade-area{padding:20px;text-align:center;margin-top:50px}
</style>
</head>
<body>

<div class="header">
  <div><b>RQPtrade</b> <span class="balance" id="balDisplay">$70.50</span></div>
  <button onclick="openDeposit()" style="width:auto;padding:8px 15px;background:#ff4444;border-radius:20px">Deposit</button>
</div>

<div class="trade-area">
  <h3>Volatility 10 (1s) Index</h3>
  <p>Balance: <span id="mainBal">$70.50</span></p>
  <button onclick="openDeposit()" class="btn-red" style="max-width:300px">Deposit $50.00</button>
  <p style="margin-top:20px;color:#888;font-size:12px">Even/Odd trading - Live Chat</p>
</div>

<!-- Deposit Modal -->
<div class="modal" id="depositModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between"><h3>Deposit funds</h3><span onclick="closeDeposit()" style="cursor:pointer">X</span></div>
    <p style="font-size:12px;color:#aaa">Enter MPESA number to receive STK push</p>
    <input type="tel" id="phoneInput" placeholder="254712345678" value="254">
    <input type="number" id="amountInput" value="50" min="1">
    <button class="btn-red" id="depositBtn" onclick="realDeposit()">Deposit $50.00</button>
    <div id="status" style="margin-top:10px;font-size:12px;color:#0f0"></div>
  </div>
</div>

<script>
let balance = 70.50;
function openDeposit(){ document.getElementById('depositModal').classList.add('active'); }
function closeDeposit(){ document.getElementById('depositModal').classList.remove('active'); }

async function realDeposit(){
  let phone = document.getElementById('phoneInput').value.trim();
  let amount = document.getElementById('amountInput').value.trim() || 50;
  
  if(!phone || phone.length < 9){ alert('Enter valid phone 2547XXXXXXXX'); return; }
  phone = phone.replace(/\D/g,'');
  if(phone.startsWith('0')) phone = '254' + phone.slice(1);
  if(phone.length === 9) phone = '254' + phone;
  
  const btn = document.getElementById('depositBtn');
  const status = document.getElementById('status');
  const oldText = btn.innerText;
  btn.innerText = 'Sending STK... Wait';
  btn.disabled = true;
  status.innerText = 'Calling Safaricom...';
  
  try{
    const res = await fetch('/api/mpesa', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ phone: phone, amount: parseInt(amount) })
    });
    const data = await res.json();
    console.log('REAL MPESA:', data);
    
    if(data.ResponseCode === '0'){
      status.innerText = '✅ STK Sent to ' + phone;
      alert('✅ REAL STK PUSH SENT!\n\nCheck phone ' + phone + '\nEnter MPESA PIN\n\nWe will add balance after you pay.');
      closeDeposit();
    } else {
      status.innerText = '❌ Failed';
      alert('MPESA Error:\n' + JSON.stringify(data, null, 2));
    }
  }catch(e){
    status.innerText = 'Error: ' + e.message;
    alert('Network Error: ' + e.message);
  }finally{
    btn.innerText = oldText;
    btn.disabled = false;
  }
}

// Update balance display when MPESA callback confirms (you need to implement polling later)
function addRealBalance(amt){
  balance += parseFloat(amt);
  document.getElementById('balDisplay').innerText = '$' + balance.toFixed(2);
  document.getElementById('mainBal').innerText = '$' + balance.toFixed(2);
}
</script>

</body>
</html>
