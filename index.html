<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rader Trader</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0A0A0A;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#121212;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:18px;letter-spacing:1px}
.logo b{color:#FF6444}
.bal{background:#1E1E1E;padding:6px 12px;border-radius:20px;font-size:14px}
.dep{background:#FF6444;color:#000;border:0;padding:8px 16px;border-radius:10px;font-weight:800}
.tabs{display:flex;gap:8px;padding:12px}
.tabs div{flex:1;text-align:center;padding:10px;border-radius:20px;background:#1E1E1E;color:#888;font-size:13px}
.tabs div.active{background:#251512;color:#FF6444;border:1px solid #FF6444}
.box{margin:0 12px;background:#121212;border-radius:14px;padding:12px;border:1px solid #222}
#chart{width:100%;height:200px;display:block}
.digits{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:14px 12px 0}
.digits div{background:#1E1E1E;padding:10px 0;text-align:center;border-radius:8px;color:#888;font-size:13px}
.digits div.hot{background:#FF6444;color:#000;font-weight:900;transform:scale(1.1)}
.row{display:flex;gap:8px;margin:12px}
.row button{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800}
.modeOn{background:#FF6444;color:#000}
.modeOff{background:#1E1E1E;color:#666}
.stake{margin:12px;background:#121212;border-radius:12px;padding:14px;border:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.pres{display:flex;gap:6px;padding:0 12px}
.pres div{flex:1;background:#1E1E1E;padding:9px;text-align:center;border-radius:8px;font-size:12px;border:1px solid #222}
.pres div.on{border-color:#FF6444;color:#FF6444}
.trades{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.trades button{padding:16px;border-radius:14px;border:0;font-weight:900;text-align:left;line-height:1.2}
.even{background:#1A1212;border:1px solid #FF6444!important;color:#FF6444}
.odd{background:#12121A;border:1px solid #555!important;color:#aaa}
</style>
</head>
<body>
<div class="top">
<div class="logo"><b>R</b>ADER</div>
<div class="bal">R <span id="bal">$0.00</span> ▾</div>
<button class="dep" onclick="dep()">Deposit</button>
</div>

<div class="tabs"><div>Matches/Differs</div><div class="active">Even/Odd</div><div>Over/Under</div></div>

<div class="box">
<div style="display:flex;justify-content:space-between"><div><b>
