<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNN Trade</title><style>body{margin:0;background:#05070a;color:#fff;font-family:sans-serif}.h{display:flex;justify-content:space-between;padding:12px;background:#0e1218}.b{color:#00ff88;font-weight:800}canvas{width:100%;height:200px;background:#0a0e14;border-radius:12px;display:block;margin:10px auto;border:1px solid #1e2a38}.d-row{display:flex;gap:4px;padding:10px}.d{flex:1;text-align:center}.c{width:36px;height:36px;border-radius:50%;background:#1a2332;display:flex;align-items:center;justify-content:center;margin:0 auto;font-weight:800;border:2px solid #2a3545}.c.a{background:#00e5ff;color:#000}.btn{flex:1;padding:18px;border-radius:12px;border:none;font-weight:900;color:#fff;font-size:16px}.even{background:#00c853}.odd{background:#9c27b0}</style></head><body>
<div class="h"><div>TNNbinary ● <span id="bal">$70.50</span></div><div class="b" id="price">9450.83</div></div>
<div style="padding:10px;font-size:13px">Volatility 10 (1s) Index <span id="live" style="color:#00ff88">● LIVE</span></div>
<canvas id="ch"></canvas>
<div class="d-row" id="drow"></div>
<div style="padding:10px">STAKE $<span id="stk">10</span></div>
<div style="padding:0 10px;display:flex;gap:8px"><button onclick="setS(1)">$1</button><button onclick="setS(5)">$5</button><button onclick="setS(10)" style="background:#00e5ff;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:800">$10</button><button onclick="setS(25)">$25</button><button onclick="setS(50)">$50</button></div>
<div style="display:flex;gap:10px;padding:12px"><button class="btn even" onclick="tr('Even')">Even<br><small id="ep">95.2% $19.52</small></button><button class="btn odd" onclick="tr('Odd')">Odd<br><small id="op">95.2% $19.52</small></button></div>
<script>
let stake=10,bal=70.50,p=9450.83,prices=[],cnt=Array(10).fill(0),tot=0,last=3;
let cv=document.getElementById('ch'),ctx=cv.getContext('2d');
function rs(){cv.width=cv.offsetWidth;cv.height=200}rs();window.onresize=rs;
function dr(){ctx.clearRect(0,0,cv.width,200);if(prices.length<2)return;ctx.beginPath();ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;let mn=Math.min(...prices),mx=Math.max(...prices);prices.forEach((v,i)=>{let x=i/(prices.length-1)*cv.width;let y=180-((v-mn)/(mx-mn||1))*160;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}
function dg(){let r=document.getElementById('drow');r.innerHTML='';for(let i=0;i<10;i++){let per=tot?((cnt[i]/tot)*100).toFixed(1):'0.0';r.innerHTML+=`<div class="d"><div class="c ${i==last?'a':''}">${i}</div><div style="font-size:10px;color:#888">${per}%</div></div>`}}
function setS(v){stake=v;document.getElementById('stk').innerText=v;let pay=(v*1.952).toFixed(2);document.getElementById('ep').innerText='95.2% $'+pay;document.getElementById('op').innerText='95.2% $'+pay}
function tr(t){let w=(t=='Even'&&last%2==0)||(t=='Odd'&&last%2==1);if(w){bal+=stake*0.952;alert(t+' WIN! +$'+(stake*0.952).toFixed(2)+' Digit:'+last)}else{bal-=stake;alert(t+' LOSS! -$'+stake+' Digit:'+last)}document.getElementById('bal').innerText='$'+bal.toFixed(2)}
setInterval(()=>{p+= (Math.random()-0.5)*2;if(Math.random()>0.7)p+= (Math.random()-0.5)*3;prices.push(p);if(prices.length>70)prices.shift();last=Math.abs(Math.floor(p*10)%10);cnt[last]++;tot++;document.getElementById('price').innerText=p.toFixed(2);document.getElementById('live').innerText='● LIVE '+new Date().toLocaleTimeString()+' D:'+last;dr();dg()},500);
dg();dr();
</script></body></html>
