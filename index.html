<script>
// FIX ALL TAPS - KEEP SAME DESIGN
let stake=10, dur=2, selDigit=9, bal=0, price=9448.49;
function toast(m){let l=document.getElementById('log')||document.createElement('div');l.id='log';l.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#162040;padding:10px 16px;border-radius:8px;border:1px solid #ff2e2e;z-index:999;font-size:12px';l.innerText=m;document.body.appendChild(l);setTimeout(()=>l.remove(),2500)}

// 1. MENU hamburger
document.querySelectorAll('span').forEach(s=>{if(s.textContent==='☰')s.onclick=()=>document.getElementById('menu').style.display='flex'});

// 2. TABS Matches/Differs Even/Odd Over/Under
document.querySelectorAll('.tab, button').forEach(b=>{
  if(['Matches/Differs','Even/Odd','Over/Under'].includes(b.textContent.trim())){
    b.onclick=function(){document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.background='#1a2235'});this.classList.add('active');this.style.background='#ff2e2e';toast(this.textContent+' active')};
  }
});

// 3. DIGITS 0-9 circles
document.querySelectorAll('.digit, div').forEach(d=>{
  if(/^[0-9]$/.test(d.textContent.trim()) && d.className.includes('digit') || (d.textContent.trim().length===1 && !isNaN(d.textContent))){
    let txt=d.textContent.trim();
    if(txt.length===1 && d.offsetWidth<40){
      d.style.cursor='pointer';
      d.onclick=function(){document.querySelectorAll('.digit').forEach(x=>{x.classList.remove('active');x.style.background='#1a2235'});this.classList.add('active');this.style.background='#ff2e2e';selDigit=parseInt(txt);toast('Digit '+txt+' selected')};
    }
  }
});
// Fix for your screenshot digit circles
let circles=document.querySelectorAll('.digits div, div[style*="border-radius:50%"]');
circles.forEach(c=>{if(/^[0-9]$/.test(c.textContent.trim().charAt(0))){c.style.cursor='pointer';c.onclick=function(){document.querySelectorAll('.digit').forEach(x=>x.style.background='#1a2235');this.style.background='#ff2e2e';selDigit=parseInt(this.textContent);}}});

// 4. DURATION 1-10
document.querySelectorAll('.gbox, .grid10 div').forEach(b=>{
  let n=parseInt(b.textContent);
  if(n>=1 && n<=10){b.style.cursor='pointer';b.onclick=function(){document.querySelectorAll('.gbox').forEach(x=>{x.classList.remove('active');x.style.background='#1a2235'});this.classList.add('active');this.style.background='#ff2e2e';dur=n;toast(n+' ticks')};}
});

// 5. AUTO / MANUAL
let autoBtn=document.evaluate("//button[contains(text(),'AUTO')]",document,null,9,null).singleNodeValue;
let manualBtn=document.evaluate("//button[contains(text(),'MANUAL')]",document,null,9,null).singleNodeValue;
if(autoBtn)autoBtn.onclick=function(){this.style.background='#ff2e2e';if(manualBtn)manualBtn.style.background='transparent';toast('AUTO on');};
if(manualBtn)manualBtn.onclick=function(){this.style.background='#ff2e2e';if(autoBtn)autoBtn.style.background='transparent';toast('MANUAL on');};

// 6. STAKE - +
let stakeMinus=document.evaluate("//span[text()='−' or text()='-']",document,null,9,null).singleNodeValue;
let stakePlus=document.evaluate("//span[text()='+']",document,null,9,null).singleNodeValue;
function updateStake(){let el=document.getElementById('stake');if(el)el.innerText=stake;let ev=document.evaluate("//button[contains(text(),'Even')]",document,null,9,null).singleNodeValue;if(ev)ev.innerHTML=`Even <span style="float:right">$${(stake*0.195).toFixed(2)}</span><br><small>52.01%</small>`;let od=document.evaluate("//button[contains(text(),'Odd')]",document,null,9,null).singleNodeValue;if(od)od.innerHTML=`Odd <span style="float:right">$${(stake*0.195).toFixed(2)}</span><br><small>50.05%</small>`;}
if(stakeMinus)stakeMinus.onclick=()=>{stake=Math.max(1,stake-1);updateStake()};
if(stakePlus)stakePlus.onclick=()=>{stake++;updateStake()};

// 7. EVEN / ODD TRADE BUTTONS
document.querySelectorAll('button').forEach(b=>{
  if(b.textContent.includes('Even') && b.textContent.includes('$')){b.onclick=()=>{let last=Math.floor(price)%10;let win=last%2===0;toast((win?'✓ WIN Even last '+last+' +$'+(stake*0.95).toFixed(2):'✗ LOSS Even last '+last+' -$'+stake));if(win)bal+=stake*0.95;else bal-=stake;document.getElementById('bal').innerText='$'+bal.toFixed(2)}};
  if(b.textContent.includes('Odd') && b.textContent.includes('$')){b.onclick=()=>{let last=Math.floor(price)%10;let win=last%2!==0;toast((win?'✓ WIN Odd last '+last+' +$'+(stake*0.95).toFixed(2):'✗ LOSS Odd last '+last+' -$'+stake));if(win)bal+=stake*0.95;else bal-=stake;document.getElementById('bal').innerText='$'+bal.toFixed(2)}};
});

// 8. DEPOSIT BUTTON
let depBtn=document.evaluate("//button[contains(text(),'Deposit')]",document,null,9,null).singleNodeValue;
if(depBtn)depBtn.onclick=()=>{let m=document.getElementById('depModal');if(m)m.classList.add('open');else toast('Deposit: M-Pesa / USDT / Worldcoin / P2P')};

// 9. TARGET STOP MULT - tap to edit
document.querySelectorAll('.box').forEach(b=>{
  if(b.textContent.includes('TARGET')||b.textContent.includes('STOP')||b.textContent.includes('MULT')){b.style.cursor='pointer';b.onclick=()=>{let v=prompt('Enter new value for '+b.textContent.split('\n')[0], b.querySelector('b')?.innerText);if(v&&b.querySelector('b'))b.querySelector('b').innerText=v};}
});

// 10. Live Chat / AI / Positions
let lc=document.evaluate("//div[contains(text(),'Live Chat')]",document,null,9,null).singleNodeValue;if(lc)lc.onclick=()=>toast('Live Chat: support@rqptrade.com');
let ai=document.evaluate("//div[contains(text(),'AI')]",document,null,9,null).singleNodeValue;if(ai)ai.onclick=()=>{let m=document.getElementById('scanModal');if(m)m.style.display='flex';else toast('Entry Scanner: Deep Scan for Best Market')};
let pos=document.evaluate("//div[contains(text(),'Positions')]",document,null,9,null).singleNodeValue;if(pos)pos.onclick=()=>toast('No open positions - Session P/L +0.00');

console.log('V6 TAP FIX LOADED - All buttons working');
</script>
