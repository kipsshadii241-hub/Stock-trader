<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KQbinary Pro</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0a0a0f;color:#fff}.top{padding:12px 16px;background:#11111a;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900}.logo b{color:#ff8a1a}.card{margin:10px 12px;background:#15151f;border-radius:16px;padding:14px;border:1px solid #222236}.price{font-size:32px;font-weight:900}.chart{height:110px;background:#0e0e17;border-radius:12px;margin:10px 0}.grid10{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}.d{padding:8px 2px;border-radius:10px;background:#1e1e2d;text-align:center}.d.hot{border:1px solid #ff8a1a;background:#2a1e12}.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:800}.btn-orange{background:#ff8a1a;color:#000;width:100%}.btn-dark{background:#1c1c27;color:#aaa}.row{display:flex;gap:8px;margin-top:10px}input,select{flex:1;padding:12px;border-radius:10px;background:#0e0e17;border:1px solid #2a2a3a;color:#fff}.start{width:100%;padding:18px;border-radius:14px;background:#ff8a1a;color:#000;font-weight:900;font-size:18px;border:none;margin-top:12px}.log{height:120px;overflow:auto;background:#0a0a0f;border-radius:10px;padding:8px;font-size:11px;margin-top:10px;color:#999}.statBox{flex:1;background:#0e0e17;border-radius:10px;padding:10px;text-align:center}.sub{color:#777;font-size:12px}</style></head><body>
<div class="top"><div class="logo"><b>KQ</b>binary <span id="status" style="font-size:11px;background:#1c1c27;padding:4px 8px;border-radius:20px">CONNECTING</span></div><div style="text-align:right"><div class="sub">Balance</div><div id="bal" style="font-weight:900">$ --</div></div></div>
<div class="card"><div>Volatility 10 (1s) <span style="background:#ff8a1a;color:#000;padding:2px 6px;border-radius:6px;font-size:10px">1s</span> <span id="spot" class="sub">--</span></div><div class="price" id="tickPrice">--</div><div class="chart"><canvas id="c" style="width:100%;height:100%"></canvas></div><input id="tokenInput" placeholder="Paste Deriv Token from app.deriv.com/account/api-token"><button class="btn btn-orange" id="connectBtn" style="margin-top:8px">SAVE TOKEN & CONNECT (ws.deriv.com)</button><div class="sub">Endpoint wss://ws.deriv.com - works on Safaricom</div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><span class="sub">Digits Analysis</span><span class="sub" id="totalTicks">Ticks:0</span></div><div class="grid10" id="digitsGrid"></div><div class="row"><div class="statBox">MATCH %<br><b id="matchP">--</b></div><div class="statBox">DIFFER %<br><b id="differP" style="color:#ff8a1a">--</b></div></div></div>
<div class="card"><div class="row"><span>DIGIT</span><select id="digit"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option value="5" selected>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select><select id="type"><option value="DIFF">DIFFER</option><option value="MATCH">MATCH</option></select></div><div class="row"><span>STAKE</span><input id="stake" type="number" value="10"><select id="dur"><option value="1">1 Tick</option><option value="5" selected>5 Ticks</option></select></div><div class="row"><button class="btn btn-dark" onclick="stake.value=1">$1</button><button class="btn btn-dark" onclick="stake.value=5">$5</button><button class="btn btn-orange" onclick="stake.value=10">$10</button><button class="btn btn-dark" onclick="stake.value=25">$25</button></div><div class="row"><div style="flex:1">TARGET<input id="target" value="200"></div><div style="flex:1">STOP<input id="sl" value="50"></div><div style="flex:1">MART<input id="mart" value="2"></div></div><button class="start" id="autoBtn">START AUTO</button><div class="row"><span class="sub">Profit</span><b id="profit">$0</b><span class="sub">W</span><span id="wins">0</span><span class="sub">L</span><span id="loss">0</span></div><div class="log" id="log"></div></div>
<script>
const ENDPOINT='wss://ws.deriv.com/websockets/v3?app_id=1089';let ws=null,token='',ticks=[],digits=[],counts={},profit=0,wins=0,loss=0,auto=false,currentStake=10,lastPrice=0;
const $=id=>document.getElementById(id);const canvas=$('c'),ctx=canvas.getContext('2d');
function log(m){$('log').innerHTML=new Date().toLocaleTimeString()+' '+m+'<br>'+$('log').innerHTML}
function draw(){if(!ticks.length)return;let w=canvas.width=canvas.offsetWidth*2,h=canvas.height=canvas.offsetHeight*2;ctx.clearRect(0,0,w,h);let max=Math.max(...ticks),min=Math.min(...ticks),rg=max-min||1;ctx.beginPath();ctx.strokeStyle='#ff8a1a';ticks.forEach((p,i)=>{let x=i/ticks.length*w,y=h-((p-min)/rg)*h*0.8-20;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}
function updateDigits(){counts={};for(let i=0;i<10;i++)counts[i]=0;digits.forEach(d=>counts[d]++);let total=digits.length,sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]),html='';for(let i=0;i<10;i++){let isHot=sorted.slice(0,2).map(s=>s[0]).includes(String(i)),pct=total?((counts[i]/total)*100).toFixed(0):0;html+=`<div class="d ${isHot?'hot':''}"><b>${i}</b><span style="font-size:11px;color:#ff8a1a">${pct}%</span></div>`}$('digitsGrid').innerHTML=html;$('totalTicks').textContent='Ticks:'+total;let sel=$('digit').value,mp=total?(counts[sel]/total*100).toFixed(1):0;$('matchP').textContent=mp+'%';$('differP').textContent=(100-mp).toFixed(1)+'%'}
function connect(){let t=$('tokenInput').value.trim()||localStorage.getItem('deriv_token');if(!t){alert('Paste Deriv token! From app.deriv.com/account/api-token');return}token=t;localStorage.setItem('deriv_token',t);if(ws)ws.close();$('status').textContent='CONNECTING';ws=new WebSocket(ENDPOINT);ws.onopen=()=>{log('WS open');ws.send(JSON.stringify({authorize:token}))};ws.onclose=()=>{$('status').textContent='RECONNECTING';setTimeout(connect,3000)};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.error){log('ERR '+d.error.message);$('status').textContent=d.error.message;return}if(d.msg_type==='authorize'){$('bal').textContent='$'+d.authorize.balance;$('status').textContent='LIVE '+d.authorize.loginid;log('Auth '+d.authorize.loginid);ws.send(JSON.stringify({ticks:'1HZ10V',subscribe:1}));ws.send(JSON.stringify({balance:1,subscribe:1}))}if(d.msg_type==='balance')$('bal').textContent='$'+d.balance.balance;if(d.msg_type==='tick'){let q=d.tick.quote;$('tickPrice').textContent=q.toFixed(3);$('spot').textContent=new Date().toLocaleTimeString();$('tickPrice').style.color=q>lastPrice?'#22c55e':'#ef4444';lastPrice=q;ticks.push(q);if(ticks.length>100)ticks.shift();draw();let ld=parseInt(String(q).slice(-1));if(!isNaN(ld)){digits.push(ld);if(digits.length>200)digits.shift();updateDigits()}}if(d.msg_type==='buy'){log('BUY #'+d.buy.contract_id);ws.send(JSON.stringify({proposal_open_contract:1,contract_id:d.buy.contract_id,subscribe:1}))}if(d.msg_type==='proposal_open_contract'&&d.proposal_open_contract.is_sold){let p=parseFloat(d.proposal_open_contract.profit);profit+=p;$('profit').textContent='$'+profit.toFixed(2);if(p>0){wins++;$('wins').textContent=wins;currentStake=parseFloat($('stake').value);log('WIN +'+p.toFixed(2))}else{loss++;$('loss').textContent=loss;let m=parseFloat($('mart').value);currentStake*=m;log('LOSS '+p.toFixed(2)+' next $'+currentStake.toFixed(2))}if(profit>=parseFloat($('target').value)){alert('TARGET HIT $'+profit);auto=false;$('autoBtn').textContent='START AUTO'}if(profit<=-parseFloat($('sl').value)){alert('STOP LOSS $'+profit);auto=false;$('autoBtn').textContent='START AUTO'}}}}
function place(){if(!ws||ws.readyState!==1){log('Not connected');return}let st=currentStake,dig=$('digit').value,typ=$('type').value==='DIFF'?'DIGITDIFF':'DIGITMATCH';ws.send(JSON.stringify({buy:1,price:st,parameters:{amount:st,basis:'stake',contract_type:typ,barrier:dig,currency:'USD',duration:1,duration_unit:'t',symbol:'1HZ10V'}}));log('BUY '+typ+' D='+dig+' $'+st)}
let loop=null;$('connectBtn').onclick=connect;$('autoBtn').onclick=()=>{auto=!auto;if(auto){currentStake=parseFloat($('stake').value);$('autoBtn').textContent='STOP 🛑';loop=setInterval(place,3000);log('AUTO START')}else{$('autoBtn').textContent='START AUTO';clearInterval(loop);log('AUTO STOP')}};
window.onload=()=>{let t=localStorage.getItem('deriv_token');if(t){$('tokenInput').value=t;connect()}updateDigits()}
</script></body></html>
