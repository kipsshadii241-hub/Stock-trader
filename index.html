<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">
<title>TNN AVIATOR PREDICTOR</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.app{padding:20px}
.card{background:#111;border:2px solid red;border-radius:15px;padding:20px;margin:20px 0}
.big{font-size:70px;color:#ff0000;font-weight:bold;text-shadow:0 0 20px red}
button{width:90%;padding:18px;background:red;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="app">
<h2 style="color:red">TNN AVIATOR PREDICTOR</h2>
<div class="card">
<p>🚀 NEXT PREDICTION</p>
<div class="big" id="prediction">2.15x</div>
<p id="time"></p>
</div>
<button onclick="getNext()">GET NEXT PREDICTION</button>
<div class="card" style="text-align:left">
<p>📊 Past Results:</p>
<div id="history">Click button to start</div>
</div>
</div>
<script>
function getNext(){
let odds=(Math.random()*2.5+1.1).toFixed(2);
let now=new Date();
document.getElementById('prediction').innerText=odds+'x';
document.getElementById('time').innerText=now.toLocaleString();
let h=document.getElementById('history');
h.innerHTML='<div>✅ '+now.toLocaleTimeString()+' - '+odds+'x</div>'+h.innerHTML;
}
</script>
</body>
</html>
