<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">
<title>TNN AVIATOR PREDICTOR</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.login{margin-top:100px;padding:20px}
input{width:85%;padding:16px;border:3px solid red;border-radius:12px;text-align:center;font-size:18px;background:#111;color:#fff}
button{padding:14px 35px;background:red;color:#fff;border:none;border-radius:10px;font-weight:bold}
.app{display:none;padding:15px}
.card{background:#111;border:2px solid red;border-radius:15px;padding:15px;margin:15px 0}
.big{font-size:70px;color:#ff0000;font-weight:bold}
.site{display:inline-block;background:#222;border:1px solid red;margin:5px;padding:8px 12px;border-radius:8px;font-size:12px}
.history-item{display:inline-block;background:#222;margin:4px;padding:8px 14px;border-radius:8px;color:#0f0;font-weight:bold;border:1px solid #333}
</style>
</head>
<body>

<div id="loginPage" class="login">
<h1 style="color:red">TNN AVIATOR PREDICTOR</h1>
<p>APP ID:</p>
<input id="appId" type="password" placeholder="Enter ID"><br><br>
<button onclick="login()">CONTINUE</button>
<p id="msg" style="color:#ff4444"></p>
</div>

<div id="mainApp" class="app">
<h2 style="color:red">TNN AVIATOR PREDICTOR</h2>

<div class="card">
<p>🚀 NEXT PREDICTION</p>
<div class="big" id="prediction">--x</div>
<p id="time"></p>
</div>

<button onclick="getNext()" style="width:95%;padding:18px;font-size:18px;margin-bottom:10px">GET NEXT PREDICTION</button>

<div class="card">
<p>🌐 SUPPORTED SITES (18)</p>
<div>
<span class="site">1xBet</span><span class="site">Melbet</span><span class="site">22Bet</span><span class="site">1Win</span><span class="site">Paripesa</span><span class="site">Betwinner</span><span class="site">Mostbet</span><span class="site">888Starz</span><span class="site">Betway</span><span class="site">Odibets</span><span class="site">Sportpesa</span><span class="site">Mozzart</span><span class="site">Betika</span><span class="site">Bangbet</span><span class="site">SAFARIBET</span><span class="site">PariPesa KE</span><span class="site">Helabet</span><span class="site">Linebet</span>
</div>
</div>

<div class="card" style="text-align:left">
<p>📊 Past Results:</p>
<div id="history" style="text-align:center"><span style="color:#777">Click GET NEXT</span></div>
</div>
</div>

<script>
const SECRET="#pro750@";
function login(){
let id=document.getElementById('appId').value.trim();
if(id===SECRET){document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';}
else{document.getElementById('msg').innerText='Invalid ID! Contact Admin';}
}
function getNext(){
let odds=(Math.random()*3+1.10).toFixed(2);
let now=new Date();
document.getElementById('prediction').innerText=odds+'x';
document.getElementById('time').innerText=now.toLocaleString();
let h=document.getElementById('history');
if(h.innerHTML.includes('Click GET NEXT')) h.innerHTML='';
h.innerHTML='<span class="history-item">✅ '+odds+'x</span>'+h.innerHTML;
}
</script>
</body>
</html>
