<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RQP Trader</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px;text-align:center}
.card{background:#111;border-radius:15px;padding:20px;margin:20px 0}
button{background:#00ff88;color:#000;padding:15px 30px;border:none;border-radius:10px;font-weight:bold;font-size:18px;width:100%}
input{padding:15px;border-radius:10px;border:none;width:80%;margin:10px;font-size:18px;text-align:center}
</style>
</head>
<body>
<h1>💰 RQP STOCK TRADER</h1>
<div class="card">
<h2>Balance: $ <span id="bal">0.00</span></h2>
<input type="number" id="amount" value="10" placeholder="Amount $">
<button onclick="depositFunds()">Deposit via MPESA</button>
<p style="color:#888;font-size:12px">Phone: 0703689230</p>
</div>

<script>
let balance = 0;
async function depositFunds(){
  const amount = document.getElementById('amount').value;
  const phone = "254703689230";
  if(!amount) return alert('Enter amount');
  const btn = document.querySelector('button');
  btn.innerText = 'Sending STK...';
  try{
    const res = await fetch('/api/mpesa',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({amount:amount, phone:phone})
    });
    const data = await res.json();
    console.log(data);
    if(data.success){
      alert('✅ STK PUSH SENT to '+phone+'! Check phone and enter PIN!');
      // For sandbox test, add balance immediately
      balance += Number(amount);
      document.getElementById('bal').innerText = balance.toFixed(2);
    }else{
      alert('❌ '+ (data.error||'Failed - but adding for test'));
      // Still add for testing
      balance += Number(amount);
      document.getElementById('bal').innerText = balance.toFixed(2);
    }
  }catch(err){
    alert('Error: '+err.message+' - Adding for test');
    balance += Number(amount);
    document.getElementById('bal').innerText = balance.toFixed(2);
  } finally {
    btn.innerText = 'Deposit via MPESA';
  }
}
</script>
</body>
</html>
