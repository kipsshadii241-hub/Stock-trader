<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#0e0e14;color:white" class="p-3">
<div id="log" class="bg-zinc-900 p-3 rounded-xl text-xs">LOADING... Connecting automatically</div>
<div class="flex justify-between mt-3"><b>KQbinary REAL</b><span id="bal" class="bg-zinc-800 px-3 py-1 rounded-full text-sm">Connecting...</span></div>
<div class="bg-[#14141e] mt-3 p-3 rounded-xl border border-zinc-800">
<div class="flex justify-between text-xs"><span id="status">Connecting to Deriv...</span><span id="price" class="text-orange-400 font-bold">-</span></div>
<canvas id="chart" width="800" height="250" style="width:100%;background:black;border-radius:8px;margin-top:8px"></canvas>
<div id="digits" class="flex gap-1 mt-3"></div>
</div>
<div class="flex gap-2 mt-3">
<button onclick="trade('even')" class="flex-1 bg-orange-500 text-black py-4 rounded-xl font-black">AUTO EVEN</button>
<button onclick="stop()" class="flex-1 bg-zinc-800 py-4 rounded-xl">STOP</button>
</div>
<script>
let prices=[], counts=Array(10).fill(0), total=0, ws=null, real=false, bot=null, cur=10, bal=0;
let token="pat_2042258fe2355ceb2beb4c9c75abb1bcc7950531715fec26eeaa13354b3a67b7";
let cv=document.getElementById('chart'), ctx=cv.getContext('2d');
function dlog(t){document.getElementById('log').innerHTML+= "<br>" + t; console.log(t);}
function draw(){if(prices.length<2)return;ctx.clearRect(0,0,cv.width,cv.height);let min=Math.min(...prices),max=Math.max(...prices),r=max-min||1;ctx.beginPath();ctx.strokeStyle='#ff6b00';ctx.lineWidth=3;prices.forEach((p,i)=>{let x=i/(prices.length-1)*cv.width;let y=cv.height-((p-min)/r)*cv.height*0.7-20;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}
function add(q){prices.push(q);if(prices.length>60)prices.shift();let last=parseInt(Math.abs(q*100).toString().slice(-1));if(isNaN(last))last=0;counts[last]++;total++;document.getElementById('price').innerText=q.toFixed(2);let row=document.getElementById('digits');row.innerHTML='';for(let i=0;i<10;i++){let cl=i==last?'bg-orange-500 text-black':'bg-zinc-800';row.innerHTML+=`<div class="flex-1 ${cl} py-2 rounded text-center font-bold">${i}</div>`;}draw();}

function connect(){
 dlog("1. Token: " + token.slice(0,15) + "...");
 dlog("2. Trying ws.derivws.com...");
 ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{dlog("3. WebSocket OPEN ✅ Sending auth"); ws.send(JSON.stringify({authorize:token}));};
 ws.onmessage=(e)=>{
  let d=JSON.parse(e.data); console.log(d);
  if(d.authorize){
   real=true; bal=parseFloat(d.authorize.balance); document.getElementById('bal').innerText='$'+bal.toFixed(2)+' REAL ✅ ' + d.authorize.email;
   document.getElementById('status').innerText='LIVE R_10 REAL ✅'; dlog("4. ✅ AUTHORIZED! Email: "+d.authorize.email+" Balance: $"+bal);
   ws.send(JSON.stringify({balance:1,subscribe:1})); ws.send(JSON.stringify({ticks:'R_10',subscribe:1}));
  }
  if(d.tick){add(parseFloat(d.tick.quote));}
  if(d.balance){document.getElementById('bal').innerText='$'+parseFloat(d.balance.balance).toFixed(2)+' REAL ✅';}
  if(d.buy){dlog("✅ TRADE PLACED ID "+d.buy.contract_id);}
  if(d.error){dlog("❌ ERROR: "+d.error.code+" - "+d.error.message); if(d.error.code=="InvalidToken"){dlog("TOKEN INVALID - You created token on REAL account but need DEMO token OR enable Trade permission when creating token");}}
 };
 ws.onerror=(err)=>{dlog("❌ WebSocket ERROR - Still blocked by ISP, WARP not routing Chrome. Try Firefox browser with WARP ON"); setTimeout(()=>{dlog("Retrying binaryws.com..."); try2();},2000);};
 ws.onclose=()=>{if(!real)dlog("❌ Closed - Trying next server");};
}
function try2(){
 let ws2=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
 ws2.onopen=()=>{ws2.send(JSON.stringify({authorize:token})); dlog("Connected to binaryws.com, authorizing...");};
 ws2.onmessage=(e)=>{
  let d=JSON.parse(e.data);
  if(d.authorize){ws=ws2; real=true; bal=parseFloat(d.authorize.balance); document.getElementById('bal').innerText='$'+bal.toFixed(2)+' REAL ✅'; dlog("✅ CONNECTED via binaryws! "+d.authorize.email); ws.send(JSON.stringify({ticks:'R_10',subscribe:1}));}
  if(d.tick){add(parseFloat(d.tick.quote));}
  if(d.error){dlog("❌ "+d.error.message);}
 };
 ws2.onerror=()=>{dlog("❌ Both servers blocked. SOLUTION: 1. In WARP app click 3 dots > Settings > Connection > Enable WARP 2. Use Firefox browser 3. Refresh"); startSim();};
}
function startSim(){let b=9450; setInterval(()=>{if(!real){b+=(Math.random()-0.5)*0.8; add(b);} },300); dlog("Running in SIMULATION while Deriv blocked - trades not real");}
function trade(t){if(!real){dlog("Not real yet - fix connection first");return;} let ctype=t=='even'?'DIGITEVEN':'DIGITODD'; ws.send(JSON.stringify({buy:1, price:cur, parameters:{amount:cur,basis:'stake',contract_type:ctype,currency:'USD',duration:1,duration_unit:'t',symbol:'R_10'}})); dlog("Placing REAL "+t+" $"+cur);}
function stop(){clearInterval(bot); dlog("Stopped");}
connect();
let b=9450; add(b);
</script>
</body>
</html>
