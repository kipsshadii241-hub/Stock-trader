<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RADER</title></head>
<body style="margin:0;background:#0A0A0A;color:#fff;font-family:system-ui;padding-bottom:80px">

<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:#121212">
<div style="font-weight:900;font-size:20px"><span style="color:#FF6444">R</span>ADER</div>
<div style="background:#1E1E1E;padding:6px 14px;border-radius:20px;font-size:14px">R <span id="bal">$0.00</span></div>
<button onclick="dep()" style="background:#FF6444;border:0;padding:8px 16px;border-radius:10px;font-weight:800">Deposit</button>
</div>

<div style="display:flex;gap:8px;padding:12px">
<div style="flex:1;background:#1E1E1E;padding:10px;border-radius:20px;text-align:center;color:#666;font-size:12px">Matches/Differs</div>
<div style="flex:1;background:#251512;border:1px solid #FF6444;padding:10px;border-radius:20px;text-align:center;color:#FF6444;font-size:12px">Even/Odd</div>
<div style="flex:1;background:#1E1E1E;padding:10px;border-radius:20px;text-align:center;color:#666;font-size:12px">Over/Under</div>
</div>

<div style="margin:0 12px;background:#121212;border:1px solid #222;border-radius:14px;padding:12px">
<b>Volatility 10 (1s) Index</b><br><small style="color:#888" id="price">9450.81 +0.02 (+0.02%)</small>
<div style="margin-top:12px;background:#000;height:140px;border-radius:10px;position:relative;overflow:hidden">
<div id="line" style="position:absolute;left:0;right:0;top:60px;height:2px;background:#FF6444"></div>

</div>

<div id="d3" style="background:#1E1E1E;padding:10px 0;text-align:center;border-radius:8px;color:#777">3</div>

<div id="d9" style="background:#1E1E1E;padding:10px 0;text-align:center;border-radius:8px;color:#777">9</div>
</div>

<div style="display:flex;gap:8px;margin:12px">
<button style="flex:1;background:#FF6444;color:#000;border:0;padding:12px;border-radius:10px;font-weight:800">AUTO</button>
<button style="flex:1;background:#1E1E1E;color:#666;border:0;padding:12px;border-radius:10px">MANUAL</button>
</div>

<div style="margin:12px;background:#121212;border:1px solid #222;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center">
<button onclick="changeStake(-1)" style="background:#1E1E1E;border:0;color:#fff;width:40px;height:40px;border-radius:8px;font-size:20px">-</button>
<div style="text-align:center"><div style="font-size:12px;color:#888">STAKE</div><b style="font-size:18px">$<span id="stk">10</span></b></div>
<button onclick="changeStake(1)" style="background:#1E1E1E;border:0;color:#fff;width:40px;height:40px;border-radius:8px;font-size:20px">+</button>
</div>

<div style="display:flex;gap:6px;padding:0 12px">
<div onclick="setS(1)" class="preset" style="flex:1;background:#1E1E1E;border:1px solid #222;padding:9px;text-align:center;border-radius:8px;font-size:12px">$1</div>
<div onclick="setS(5)" class="preset" style="flex:1;background:#1E1E1E;border:1px solid #222;padding:9px;text-align:center;border-radius:8px;font-size:12px">$5</div>
