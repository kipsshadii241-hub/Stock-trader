<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">
<title>TNN AVIATOR PREDICTOR</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.login{margin-top:100px;padding:20px}
input{width:85%;padding:16px;border:3px solid red;border-radius:12px;text-align:center;font-size:18px;background:#111;color:#fff}
button{margin-top:20px;padding:14px 35px;background:red;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:16px}
.app{display:none;padding:20px}
.card{background:#111;border:2px solid red;border-radius:15px;padding:20px;margin:20px 0}
.big{font-size:70px;color:#ff0000;font-weight:bold}
</style>
</head>
<body>

<div id="loginPage" class="login">
<h1 style="color:red">TNN AVIATOR PREDICTOR</h1>
<p>APP ID:</p>
<input id="appId" type="password" placeholder="Enter ID">
<br>
<button onclick="login()">CONTINUE</button>
<p id="msg" style="color:#ff4444;margin-top:15px"></p>
</div>

<div id="mainApp" class="app">
<h2 style="color:red">TNN AVIATOR PREDICTOR</h2>
<div class="card">
<p>🚀 NEXT PREDICTION</p>
<div class="big" id="prediction">--x</div>
<p id="time"></p>
</div>
<button onclick="getNext()">GET NEXT PREDICTION</button>
<div class="card" style="text-align:left"><p>Past Results:</p><div id="history">Click button</div></div>
</div>

<script>
const SECRET = "#pro750@";
function login(){
let id = document.getElementById('appId').value.trim();
if(id === SECRET){
document.getElementById('loginPage').style.display='none';
document.getElementById('mainApp').style.display='block';
}else{
document.getElementById('msg').innerText='Invalid ID! Contact Admin';
}
}
function getNext(){
let odds=(Math.random()*2.5+1.1).toFixed(2);
let now=new Date();
document.getElementById('prediction').innerText=odds+'x';
document.getElementById('time').innerText=now.toLocaleString();
document.getElementById('history').innerHTML='<div>✅ '+now.toLocaleTimeString()+' - '+odds+'x</div>'+document.getElementById('history').innerHTML;
}
</script>
</body>
</html>
