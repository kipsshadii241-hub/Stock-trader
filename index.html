<script>
const ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
let lastPrice=0;
ws.onopen = ()=>{ ws.send(JSON.stringify({ticks:"R_10"})); document.querySelector('.top-price').innerText="$39.95 • CONNECTED"; }
ws.onmessage = (msg)=>{
  const data=JSON.parse(msg.data);
  if(data.tick){
    lastPrice=data.tick.quote;
    const digit = String(lastPrice).slice(-1);
    document.body.innerHTML = document.body.innerHTML.replace(/Last Digit: -/,'Last Digit: '+digit);
    // update your 0-9 highlight
    document.querySelectorAll('.digit').forEach(d=>d.classList.remove('active'));
    let el=document.getElementById('d'+digit);
    if(el) el.classList.add('active');
  }
}
async function deposit(){
  const phone=prompt("Phone 2547...","254708374149");
  const amount=prompt("Amount","10");
  const r=await fetch("/api/mpesa",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,amount})});
  const j=await r.json();
  alert(JSON.stringify(j));
}
</script>
