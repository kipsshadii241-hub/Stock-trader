<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RQP Trade V13</title><style>body{background:#080c18;color:#fff;margin:0;font-family:system-ui}.top{height:48px;background:#0e1528;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-bottom:1px solid #1e2d4f}.card{background:#121a2e;margin:8px;border-radius:12px;padding:10px;border:1px solid #1e2d4f}.box{height:120px;background:#070b18;border-radius:10px;position:relative;overflow:hidden;border:1px solid #1e2d4f}.digits{display:flex;justify-content:space-between;margin:10px 0}.d{width:30px;height:30px;border-radius:50%;background:#1a2540;display:flex;align-items:center;justify-content:center;border:1px solid #1e2d4f}.d.on{background:#ff2e2e}.row{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.g{background:#1a2540;padding:8px 0;text-align:center;border-radius:8px;border:1px solid #1e2d4f}.g.on{background:#ff2e2e}.b2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.b{background:#1a2540;padding:10px;border-radius:10px;text-align:center;border:1px solid #1e2d4f}.btn{padding:12px;border-radius:10px;border:none;color:#fff;font-weight:800;width:100%}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:15px}.modal.open{display:flex}.mb{background:#162040;width:100%;max-width:360px;border-radius:16px;padding:16px;border:1px solid #1e2d4f}.opt{padding:12px;background:#1a2540;border:1px solid #1e2d4f;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between}</style></head><body>
<div class="top"><div><b>RQP<span style="color:#ff2e2e">trade</span></b></div><div><span id="bal" style="font-weight:800">$0.00</span> <button id="depBtn" style="background:#ff2e2e;color:#fff;border:none;padding:6px 12px;border-radius:8px;margin-left:8px">Deposit</button></div></div>
<div class="card">
<div id="volBtn" style="display:flex;justify-content:space-between;background:#070b18;padding:8px 10px;border-radius:10px;border:1px solid #1e2d4f"><div><b id="volName">Volatility 10 (1s) Index</b><br><small id="volSub" style="color:#7a8aaa">9448.75</small></div><span>▼</span></div>
<div class="box"><svg width="100%" height="100%"><path id="p" fill="none" stroke="#ff3b3b" stroke-width="2"/></svg><div id="pt" style="position:absolute;right:8px;top:45%;background:#fff;color:#000;padding:3px 6px;border-radius:5px;font-size:11px;font-weight:800">9448.7</div></div>
<div class="digits" id="digits"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;background:#070b18;border-radius:8px;padding:3px"><button id="auto" style="background:#ff2e2e;color:#fff;border:none;padding:7px;border-radius:6px">AUTO</button><button id="manual" style="background:transparent;color:#7a8aaa;border:none;padding:7px">MANUAL</button></div>
<div style="display:flex;justify-content:space-between;font-size:10px;color:#7a8aaa;margin-top:6px"><span>DURATION</span><span id="dl">2 ticks</span></div><div class="row" id="dur"></div>
<div class="b2"><div class="b"><div style="font-size:9px;color:#7a8aaa">STAKE</div><div style="display:flex;justify-content:space-between;margin-top:4px"><span id="sm" style="cursor:pointer;font-size:18px">−</span><b>$<span id="st">1</span></b><span id="sp" style="cursor:pointer;font-size:18px">+</span></div></div><div class="b"><div style="font-size:9px;color:#7a8aaa">SESSION P/L</div><div id="pnl" style="margin-top:4px;font-weight:700">+0.00</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" id="even" style="background:#1a2540;border:1px solid #2a3a5a">Even $1.95</button><button class="btn" id="odd" style="background:#1a2540;border:1px solid #ff2e2e">Odd $1.95</button></div>
</div>
<div id="volModal" class="modal"><div class="mb"><div style="display:flex;justify-content:space-between"><b>Choose Volatility</b><span id="closeVol">✕</span></div>
<div class="opt" data-n="Volatility 10 (1s) Index" data-p="9448"><b>Volatility 10 (1s)</b><span>›</span></div>
<div class="opt" data-n="Volatility 25 (1s) Index" data-p="2450"><b>Volatility 25 (1s)</b><span>›</span></div>
<div class="opt" data-n="Volatility 50 (1s) Index" data-p="15230"><b>Volatility 50 (1s)</b><span>›</span></div>
<div class="opt" data-n="Volatility 100 (1s) Index" data-p="58420"><b>Volatility 100 (1s)</b><span>›</span></div>
<div class="opt" data-n="Jump 10 Index" data-p="3800"><b>Jump 10</b><span>›</span></div>
<div class="opt" data-n="Crash 500 Index" data-p="7200"><b>Crash 500</b><span>›</span></div>
<div class="opt" data-n="Boom 500 Index" data-p="5400"><b>Boom 500</b><span>›</span></div>
</div></div>
<div id="depModal" class="modal"><div class="mb"><div style="display:flex;justify-content:space-between"><b>Deposit</b><span id="closeDep">✕</span></div><div class="opt" id="mpesaOpt"><b>MPESA</b><span>›</span></div><div class="opt"><b>USDT</b><span>›</span></div></div></div>
<div id="mpesaModal" class="modal"><div class="mb"><b>MPESA Deposit</b><br><input id="amt" value="10" style="width:100%;background:#070b18;border:1px solid #1e2d4f;color:#fff;padding:10px;border-radius:8px;margin:8px 0"><input id="phone" value="+254712681370" style="width:100%;background:#070b18;border:1px solid #1e2d4f;color:#fff;padding:10px;border-radius:8px"><button id="doDep" style="background:#ff2e2e;color:#fff;border:none;width:100%;padding:12px;border-radius:10px;margin-top:10px;font-weight:700">Deposit $10</button><div id="stk" style="display:none;text-align:center;margin-top:10px">Sending STK... KES <span id="kes">1297</span></div></div></div>
<script>
var stake=1,dur=2,last=9,real=0,demo=10241,price=9448,cur=9448,prices=[],counts=[10,10,10,10,10,10,10,10,10,10];
function render(){var d=document.getElementById('digits');d.innerHTML='';for(var i=0;i<10;i++){var e=document.createElement('div');e.className='d'+(i==last?' on':'');e.innerText=i;e.onclick=(function(n){return function(){last=n;render()}})(i);d.appendChild(e)}var g=document.getElementById('dur');g.innerHTML='';for(var i=1;i<=10;i++){var el=document.createElement('div');el.className='g'+(i==dur?' on':'');el.innerText=i;el.onclick=(function(n){return function(){dur=n;document.getElementById('dl').innerText=n+' ticks';render()}})(i);g.appendChild(el)}document.getElementById('st').innerText=stake;document.getElementById('even').innerText='Even $'+(stake*1.95).toFixed(2);document.getElementById('odd').innerText='Odd $'+(stake*1.95).toFixed(2)}
function chart(){price+=(Math.random()-0.5)*2;if(price<cur-10)price=cur-5;if(price>cur+10)price=cur+5;prices.push(price);if(prices.length>40)prices.shift();var min=999999,max=-999999;for(var i=0;i<prices.length;i++){if(prices[i]<min)min=prices[i];if(prices[i]>max)max=prices[i]}var range=max-min;if(range<2)range=5;var path='';for(var i=0;i<prices.length;i++){var x=(i/prices.length*100).toFixed(1);var y=(80-((prices[i]-min)/range*60)).toFixed(1);path+=(i==0?'M':'L')+x+' '+y+' '}document.getElementById('p').setAttribute('d',path);document.getElementById('volSub').innerText=price.toFixed(2);document.getElementById('pt').innerText=price.toFixed(3);var nd=Math.floor(Math.abs(price*10))%10;if(nd!=last){last=nd;counts[last]++;render()}}
render();for(var i=0;i<30;i++)prices.push(9448+Math.sin(i/3)*2);setInterval(chart,600);
document.getElementById('volBtn').onclick=function(){document.getElementById('volModal').classList.add('open')};
document.getElementById('closeVol').onclick=function(){document.getElementById('volModal').classList.remove('open')};
var opts=document.querySelectorAll('#volModal .opt');for(var i=0;i<opts.length;i++){opts[i].onclick=function(){var n=this.getAttribute('data-n');var p=parseFloat(this.getAttribute('data-p'));document.getElementById('volName').innerText=n;cur=p;price=p;prices=[];document.getElementById('volModal').classList.remove('open')}};
document.getElementById('depBtn').onclick=function(){document.getElementById('depModal').classList.add('open')};
document.getElementById('closeDep').onclick=function(){document.getElementById('depModal').classList.remove('open')};
document.getElementById('mpesaOpt').onclick=function(){document.getElementById('depModal').classList.remove('open');document.getElementById('mpesaModal').classList.add('open')};
document.getElementById('doDep').onclick=function(){var a=parseFloat(document.getElementById('amt').value)||10;document.getElementById('kes').innerText=(a*129.7).toFixed(0);document.getElementById('stk').style.display='block';setTimeout(function(){real+=a;document.getElementById('bal').innerText='$'+real.toFixed(2);document.getElementById('mpesaModal').classList.remove('open');document.getElementById('stk').style.display='none';alert('Deposit $'+a+' credited')},2000)};
document.getElementById('sm').onclick=function(){stake=Math.max(1,stake-1);render()};
document.getElementById('sp').onclick=function(){stake++;render()};
</script></body></html>
