<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RADER</title></head>
<body style="margin:0;background:#0A0A0A;color:#fff;font-family:system-ui">

<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:#121212;position:sticky;top:0;z-index:10">
<div style="font-weight:900;font-size:20px"><span style="color:#FF6444">R</span>ADER</div>
<div style="background:#1E1E1E;padding:6px 14px;border-radius:20px;font-size:14px">R <span id="bal">$0.00</span></div>
<button onclick="dep()" style="background:#FF6444;border:0;padding:8px 16px;border-radius:10px;font-weight:800">Deposit</button>
</div>

<div style="display:flex;gap:8px;padding:12px">
<div onclick="setTab(0)" id="tab0" style="flex:1;padding:10px;border-radius:20px;text-align:center;font-size:12px;background:#1E1E1E;color:#666">Matches/Differs</div>
<div onclick="setTab(1)" id="tab1" style="flex:1;padding:10px;border-radius:20px;text-align:center;font-size:12px;background:#251512;border:1px solid #FF6444;color:#FF6444">Even/Odd</div>
<div onclick="setTab(2)" id="tab2" style="flex:1;padding:10px;border-radius:20px;text-align:center;font-size:12px;background:#1E1E1E;color:#666">Over/Under</div>
</div>

<div style="margin:0 12px;background:#121212;border:1px solid #222;border-radius:14px;padding:10px">
<div style="display:flex;justify-content:space-between"><div><b>Volatility 10 (1s) Index</b><br><small style="color:#888" id="priceTop">9453.19 +0.02 (+0.02%)</small></div><div style="background:#1E1E1E;padding:6px 10px;border-radius:8px;font-size:12px">50%</div></div>
<div style="position:relative;margin-top:10px;background:#070707;border-radius:10px">
<canvas id="c" style="width:100%;height:170px;display:block"></canvas>
<div id="livePrice" style="position:absolute;right:6px;top:30px;background:#FF6444;color:#000;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:800">9453.19</div>
</div>
<div style="display:flex;justify-content:space-between;color:#555;font-size:10px;margin-top:6px"><span>10:32:54</span><span>10:35:24</span><span>10:37:54</span><span>10:40:24</span></div>
</div>

<div style="margin:12px;background:#121212;border:1px solid #222;border-radius:12px;padding:10px">
<div style="display:flex;justify-content:space-between;font-size:10px;color:#666"><span id="modeLabel">EVEN / ODD</span><span style="color:#FF6444">HOT <span id="hot">5</span> COLD <span id="cold">9</span> LAST <span id="lastTxt">4</span></span></div>
<div style="display:flex;gap:3px;margin-top:8px;align-items:end;height:45px" id="bars"></div>
<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px" id="digits"></div>
<div style="display:flex;justify-content:space-between;font-size:9px;color:#666;margin-top:4px"><span id="leftPct">EVEN 51%</span><span id="rightPct">ODD 49%</span></div>
</div>

<div style="display:flex;gap:8px;margin:0 12px">
<button onclick="setAuto(0)" id="auto0" style="flex:1;background:#FF6444;color:#000;border:0;padding:12px;border-radius:10px;font-weight:800">AUTO</button>
<button onclick="setAuto(1)" id="auto1" style="flex:1;background:#1E1E1E;color:#666;border:0;padding:12px;border-radius:10px">MANUAL</button>
</div>

<div style="margin:12px;background:#121212;border:1px solid #222;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center">
<button onclick="changeStake(-1)" style="background:#1E1E1E;border:0;color:#fff;width:40px;height:40px;border-radius:8px;font-size:18px">-</button>
<div style="text-align:center"><div style="font-size:11px;color:#888">STAKE</div><div style="font-size:18px;font-weight:800">$ <span id="stk">5</span></div></div>
<button onclick="changeStake(1)" style="background:#1E1E1E;border:0;color:#fff;width:40px;height:40px;border-radius:8px;font-size:18px">+</button>
</div>

<div style="display:flex;gap:6px;padding:0 12px">
<div onclick="setStake(1)" style="flex:1;background:#1E1E1E;border:1px solid #222;padding:9px;text-align:center;border-radius:8px;font-size:12px">$1</div>
<div onclick="setStake(5)" style="flex:1;background:#251512;border:1px solid #FF6444;padding:9px;text-align:center;border-radius:8px;font-size:12px;color:#FF6444">$5</div>
<div onclick="setStake(10)" style="flex:1;background:#1E1E1E;border:1px solid #222;padding:9px;text-align:center;border-radius:8px;font-size:12px">$10</div>
<div onclick="setStake(25)" style="flex:1;background:#1E1E1E;border:1px solid #222;padding:9px;text-align:center;border-radius:8px;font-size:12px">$25</div>
<div onclick="setStake(50)" style="flex:1;background:#1E1E1E;border:1px solid #222;padding:9px;text-align:center;border-radius:8px;font-size:12px">$50</div>
<div onclick="setStake(100)" style="flex:1;background:#1E1E1E;border:1px solid #222;padding:9px;text-align:center;border-radius:8px;font-size:12px">$100</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:12px">
<div style="background:#121212;border:1px solid #222;border-radius:10px;padding:10px;text-align:center"><div style="font-size:9px;color:#888">TARGET</div><b>$ 200</b></div>
<div style="background:#121212;border:1px solid #222;border-radius:10px;padding:10px;text-align:center"><div style="font-size:9px;color:#888">STOP LOSS</div><b>$ 999</b></div>
<div style="background:#121212;border:1px solid #222;border-radius:10px;padding:10px;text-align:center"><div style="font-size:9px;color:#888">MULT</div><b>x 2</b></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 100px">
<button onclick="trade()" id="btn1" style="padding:14px;border-radius:12px;border:1px solid #FF6444;background:#1A1212;color:#FF6444;font-weight:900;text-align:left">Even<br><small>95.20% <span id="pay1" style="float:right">$9.76 Payout</span></small></button>
<button onclick="trade()" id="btn2" style="padding:14px;border-radius:12px;border:1px solid #444;background:#12121A;color:#bbb;font-weight:900;text-align:left">Odd<br><small>95.20% <span id="pay2" style="float:right">$9.76 Payout</span></small></button>
</div>

<div style="position:fixed;bottom:0;left:0;right:0;background:#121212;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0">
<div style="text-align:center;color:#666;font-size:11px">💬<br>Live Chat</div>
<div style="background:#FF6444;width:44px;height:44px;border-radius:12px;display:grid;place-items:center">✨</div>
<div style="text-align:center;color:#666;font-size:11px">🕒<br>Positions</div>
</div>

<script>
var bal=parseFloat(localStorage.getItem('bal')||'0'); var stake=5; var last=4; var tab=1;
var canvas=document.getElementById('c'); var ctx=canvas.getContext('2d'); var data=[]; var price=9453.19;
for(var i=0;i<60;i++) data.push(9450+Math.random()*2-1);

function resize(){canvas.width=canvas.offsetWidth*2; canvas.height=170*2; ctx.setTransform(2,0,0,2,0,0);}
resize();

function draw(){
 var W=canvas.offsetWidth, H=170; ctx.clearRect(0,0,W,H);
 ctx.strokeStyle='#222'; ctx.lineWidth=0.5; ctx.beginPath(); for(var y=0;y<H;y+=35){ctx.moveTo(0,y); ctx.lineTo(W,y);} ctx.stroke();
 ctx.beginPath(); ctx.strokeStyle='#FF6444'; ctx.lineWidth=1.5;
 for(var i=0;i<data.length;i++){var x=(i/(data.length-1))*W; var y=H/2-(data[i]-9450)*12; if(i==0)ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke();
}
draw();

function upd(){
 document.getElementById('bal').innerHTML='$'+bal.toFixed(2);
 document.getElementById('stk').innerHTML=stake;
 var pay=(stake*1.952).toFixed(2);
 document.getElementById('pay1').innerHTML='$'+pay+' Payout';
 document.getElementById('pay2').innerHTML='$'+pay+' Payout';
 localStorage.setItem('bal',bal);
}
upd();

var bars=document.getElementById('bars'); var digits=document.getElementById('digits');
for(var i=0;i<10;i++){
 var b=document.createElement('div'); b.id='bar'+i; b.style.cssText='flex:1;background:#2A2A2A;border-radius:4px 4px 0 0;height:'+(15+Math.random()*30)+'px'; bars.appendChild(b);
 var d=document.createElement('div'); d.id='d'+i; d.innerHTML=i; d.style.cssText='padding:8px 0;text-align:center;border-radius:6px;background:#1E1E1E;color:#777;font-size:12px'; digits.appendChild(d);
}
function setActive(){
 for(var i=0;i<10;i++){document.getElementById('d'+i).style.background='#1E1E1E'; document.getElementById('d'+i).style.color='#777'; document.getElementById('bar'+i).style.background='#2A2A2A';}
 document.getElementById('d'+last).style.background='#FF6444'; document.getElementById('d'+last).style.color='#000'; document.getElementById('bar'+last).style.background='#FF6444';
 document.getElementById('lastTxt').innerHTML=last;
}
setActive();

// SLOW CHART - 1 second like real Deriv
setInterval(function(){
 price+=(Math.random()-0.5)*0.35; // slower move
 data.push(price); if(data.length>60)data.shift();
 document.getElementById('priceTop').innerHTML=price.toFixed(2)+' <span style="color:#FF6444">+0.02 (+0.02%)</span>';
 document.getElementById('livePrice').innerHTML=price.toFixed(2);
 last=Math.floor(Math.random()*10); setActive();
 draw();
},1000);

function setTab(t){
 tab=t;
 document.getElementById('tab0').style.background=t==0?'#251512':'#1E1E1E'; document.getElementById('tab0').style.color=t==0?'#FF6444':'#666'; document.getElementById('tab0').style.border=t==0?'1px solid #FF6444':'none';
 document.getElementById('tab1').style.background=t==1?'#251512':'#1E1E1E'; document.getElementById('tab1').style.color=t==1?'#FF6444':'#666'; document.getElementById('tab1').style.border=t==1?'1px solid #FF6444':'none';
 document.getElementById('tab2').style.background=t==2?'#251512':'#1E1E1E'; document.getElementById('tab2').style.color=t==2?'#FF6444':'#666'; document.getElementById('tab2').style.border=t==2?'1px solid #FF6444':'none';
 if(t==0){document.getElementById('modeLabel').innerHTML='MATCHES / DIFFERS'; document.getElementById('btn1').innerHTML='Matches<br><small>95% <span id="pay1" style="float:right">$'+(stake*1.952).toFixed(2)+' Payout</span></small>'; document.getElementById('btn2').innerHTML='Differs<br><small>95% <span id="pay2" style="float:right">$'+(stake*1.952).toFixed(2)+' Payout</span></small>';}
 if(t==1){document.getElementById('modeLabel').innerHTML='EVEN / ODD'; document.getElementById('btn1').innerHTML='Even<br><small>95.20% <span id="pay1" style="float:right">$'+(stake*1.952).toFixed(2)+' Payout</span></small>'; document.getElementById('btn2').innerHTML='Odd<br><small>95.20% <span id="pay2" style="float:right">$'+(stake*1.952).toFixed(2)+' Payout</span></small>';}
 if(t==2){document.getElementById('modeLabel').innerHTML='OVER / UNDER'; document.getElementById('btn1').innerHTML='Over 4<br><small>50% <span id="pay1" style="float:right">$'+(stake*1.95).toFixed(2)+' Payout</span></small>'; document.getElementById('btn2').innerHTML='Under 5<br><small>50% <span id="pay2" style="float:right">$'+(stake*1.95).toFixed(2)+' Payout</span></small>';}
 upd();
}
function setAuto(n){
 document.getElementById('auto0').style.background=n==0?'#FF6444':'#1E1E1E'; document.getElementById('auto0').style.color=n==0?'#000':'#666';
 document.getElementById('auto1').style.background=n==1?'#FF6444':'#1E1E1E'; document.getElementById('auto1').style.color=n==1?'#000':'#666';
}
function changeStake(v){stake=Math.max(1,Math.min(100,stake+v)); upd(); setTab(tab);}
function setStake(s){stake=s; upd(); setTab(tab);}
function trade(){
 if(bal<stake){dep(); return;}
 var win=Math.random()>0.48;
 if(win){var p=stake*0.95; bal+=p; alert('WIN! Last digit '+last+' +$'+p.toFixed(2));}
 else{bal-=stake; alert('LOSS! Last digit '+last+' -$'+stake);}
 upd();
}
function dep(){var a=prompt('Deposit KES amount:'); if(!a)return; var k=parseFloat(a); if(!k)return; bal+=k/129.5; upd(); alert('Added $'+(k/129.5).toFixed(2));}
</script>
</body></html>
