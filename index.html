<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KQbinary Pro</title>
<style>
body{margin:0;background:#0b0b12;color:#fff;font-family:system-ui}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#12121a}
.kq{font-weight:900;font-size:28px;color:#ff8c2a}.kq span{color:#fff}
.bal{font-weight:700}.deposit{background:#ff8c2a;color:#000;border:none;padding:10px 16px;border-radius:10px;font-weight:800}
.tabs{display:flex;gap:8px;padding:10px;background:#12121a;margin:8px;border-radius:12px}.tab{flex:1;padding:10px;text-align:center;border-radius:8px;background:#1e1e2b;color:#999}.tab.active{background:#2a2a3a;color:#ff8c2a;border-bottom:2px solid #ff8c2a}
.card{background:#15151f;border-radius:16px;padding:12px;margin:8px}
.price{font-size:36px;font-weight:900}
.chart{height:120px;background:#0f0f18;border-radius:10px;margin:8px 0;position:relative;overflow:hidden}
#canvas{width:100%;height:100%}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.d{padding:10px;border-radius:10px;background:#1e1e2b;text-align:center;border:1px solid #2a2a3a}.d.hot{border-color:#ff8c2a;background:#2a2218}.d b{font-size:20px;display:block}.d small{color:#ff8c2a}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:800;background:#1e1e2b;color:#fff}.btn.active{background:#ff8c2a;color:#000}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0f0f18;color:#fff}
.stop{background:#ff8c2a;color:#000;padding:16px;border-radius:14px;font-weight:900;width:100%;border:none;margin-top:10px;font-size:18px}
.mut{color:#777;font-size:12px}
</style>
</head>
<body>
<div class="top"><div class="kq">KQ<span>binary</span></div><div><span class="mut">Balance</span><br><span class="bal" id="balance">$ --</span></div><button class="deposit">Deposit</button></div>
<div class="tabs"><div class="tab">Matches</div><div class="tab active">Differs</div><div class="tab">Even/Odd</div><div class="tab">Over/Under</div></div>
<div class="card"><div>Volatility 10 (1s) <span style="background:#ff8c2a;color:#000;padding:2px 8px;border-radius:6px;font-size:12px">1s</span></div><div class="price" id="price">--</div><div class="chart"><canvas id="canvas"></canvas></div><input id="token" placeholder="Deriv Token - app.deriv.com/account/api-token"><button id="connect" class="btn active" style="margin-top:8px">CONNECT</button><div id="status" class="mut">Using ws.deriv.com - No VPN needed</div></div>
<div class="card"><div class="mut">DIGITS STATS 🔥 HOT ❄️ COLD</div><div class="grid" id="digits"></div><div class="row"><div style="flex:1;background:#0f0f18;padding:10px;border-radius:10px;text-align:center">MATCH %<br><b id="matchPct">--</b></div><div style="flex:1;background:#0f0f18;padding:10px;border-radius:10px;text-align:center">DIFFER %<br><b id="differPct" style="color:#ff8c2a">--</b></div></div></div>
<div class="card"><div class="row"><div>TRADING MODE</div><button class="btn active" id="autoBtn">AUTO</button><button class="btn" id="manualBtn">MANUAL</button></div><div class="row"><span>STAKE</span><input id="stake" value="10" type="number"></div><div class="row"><button class="btn" onclick="stake=1;document.getElementById('stake').value=1">$1</button><button class="btn" onclick="stake=5;document.getElementById('stake').value=5">$5</button><button class="btn active" onclick="stake=10;document.getElementById('stake').value=10">$10</button><button class="btn" onclick="stake=25;document.getElementById('stake').value=25">$25</button></div><div class="row"><div>TARGET<input id="target" value="200"></div><div>STOP LOSS<input id="stopLoss" value="50"></div><div>MART<input id="mart" value="2"></div></div><button class="stop" id="stopBtn">START AUTO - DIFFER 5</button><div class="mut">Digit: <select id="digitSel"><option value="5" selected>5</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>7</option><option>8</option><option>9</option></select> - Smart: picks coldest automatically</div></div>
<script>
const WS='wss://ws.deriv.com/websockets/v3?app_id=1089';let ws,token='',prices=[],lastDigitCounts={},historyDigits=[],profit=0,auto=false,martStep=0;
const $=id=>document.getElementById(id);const canvas=$('canvas');const ctx=canvas.getContext('2d');
function connect(){token=$('token').value.trim()||localStorage.getItem('deriv_token');if(!token){alert('Paste Deriv token first - get from app.deriv.com/account/api-token with WARP ON');return}localStorage.setItem('deriv_token',token);if(ws)ws.close();ws=new WebSocket(WS);ws.onopen=()=>{ws.send(JSON.stringify({authorize:token}));$('status').textContent='Connected to ws.deriv.com ✅'};ws.onclose=()=>setTimeout(connect,3000);ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.error){$('status').textContent=d.error.message;return}if(d.authorize){$('balance').textContent='$'+d.authorize.balance;ws.send(JSON.stringify({ticks:'1HZ10V',subscribe:1}));ws.send(JSON.stringify({balance:1,subscribe:1}))}if(d.balance){$('balance').textContent='$'+d.balance.balance}if(d.tick){$('price').textContent=d.tick.quote;prices.push(d.tick.quote);if(prices.length>80)prices.shift();draw();let dig=String(d.tick.quote).slice(-1);if(!isNaN(dig)){historyDigits.push(parseInt(dig));if(historyDigits.length>100)historyDigits.shift();updateStats()}}}}function draw(){canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#333';ctx.lineWidth=1;let max=Math.max(...prices),min=Math.min(...prices);ctx.beginPath();ctx.strokeStyle='#fff';prices.forEach((p,i)=>{let x=i/prices.length*canvas.width;let y=canvas.height-(p-min)/(max-min+0.001)*canvas.height;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}function updateStats(){let counts={};for(let i=0;i<10;i++)counts[i]=0;historyDigits.forEach(d=>counts[d]++);let total=historyDigits.length;let html='';let sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);for(let i=0;i<10;i++){let pct=total?((counts[i]/total)*100).toFixed(1):0;let isHot=sorted.slice(0,3).some(s=>s[0]==i);html+=`<div class="d ${isHot?'hot':''}"><b>${i}</b><small>${pct}%</small></div>`}$('digits').innerHTML=html;if(total>20){let match=counts[$('digitSel').value]||0;$('matchPct').textContent=(match/total*100).toFixed(1)+'%';$('differPct').textContent=(100-match/total*100).toFixed(1)+'%'}}}function buy(){let stake=parseFloat($('stake').value);let digit=$('digitSel').value;ws.send(JSON.stringify({buy:1,price:stake,parameters:{amount:stake,basis:'stake',contract_type:'DIGITDIFF',barrier:digit,currency:'USD',duration:1,duration_unit:'t',symbol:'1HZ10V'}}))}$('connect').onclick=connect;$('stopBtn').onclick=()=>{auto=!auto;$('stopBtn').textContent=auto?'STOP 🛑':'START AUTO - DIFFER 5';if(auto)loop()};function loop(){if(!auto)return;buy();setTimeout(()=>{if(auto)loop()},2500)};window.onload=()=>{let t=localStorage.getItem('deriv_token');if(t)$('token').value=t}
</script>
</body>
</html>
