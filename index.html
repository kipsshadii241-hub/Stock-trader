<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNN AVIATOR GAME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;min-height:100vh}
.top{ background:#e00000; color:#fff; padding:12px; text-align:center; font-weight:900; font-size:14px; letter-spacing:1px;}
.game{ width:94%; max-width:500px; margin:15px auto; background:#1a1a1a; border-radius:20px; border:1px solid #333; overflow:hidden; }
.canvas{ height:45vh; background:radial-gradient(circle at bottom,#222,#000); position:relative; display:flex; align-items:center; justify-content:center;}
.plane{ position:absolute; left:10%; bottom:20%; font-size:38px; transition:0.1s; z-index:2;}
.mult{ font-size:65px; font-weight:900; z-index:3; text-shadow:0 0 20px #000; }
.status{ text-align:center; padding:8px; color:#22c55e; font-weight:bold;}
.bet-box{ padding:15px; display:flex; gap:10px; }
.btn{ flex:1; padding:18px; border-radius:30px; border:none; font-weight:900; font-size:18px; color:#fff; }
.bet{ background:#22c55e; }
.cash{ background:#f59e0b; }
.hist{ display:flex; gap:6px; padding:10px; overflow-x:auto; }
.hist span{ background:#222; padding:5px 10px; border-radius:20px; font-size:12px; white-space:nowrap;}
</style>
</head>
<body>
<div class="top">TNN AVIATOR v12.9.2 - REAL MONEY GAME - BALANCE SYSTEM</div>
<div class="game">
<div class="canvas" id="canvas"><div class="plane" id="plane">✈️</div><div class="mult" id="mult">1.00x</div></div>
<div class="status" id="stat">Waiting for next round...</div>
<div class="hist" id="hist"></div>
<div class="bet-box"><button class="btn bet" id="btn" onclick="doBet()">BET $10 - BAL $70.00</button></div>
<div style="text-align:center;padding:10px;color:#888;font-size:11px">TNN Binary Zimbabwe • Real Aviator Engine • No Fake Predictor</div>
</div>
<script>
let bal=70, mul=1, crash=0, playing=false, inBet=false, betAmt=10, pos=0, timer;
function randCrash(){ let r=Math.random(); if(r<0.55) return 1.05+Math.random()*0.9; if(r<0.85) return 2+Math.random()*3; if(r<0.95) return 5+Math.random()*5; return 10+Math.random()*20; }
function newRound(){ mul=1; pos=0; crash=randCrash(); playing=true; inBet=false; document.getElementById('stat').innerText='Round started...'; document.getElementById('stat').style.color='#22c55e'; document.getElementById('mult').style.color='#fff'; document.getElementById('mult').innerText='1.00x'; document.getElementById('btn').className='btn bet'; document.getElementById('btn').innerText='BET $10 - BAL $'+bal.toFixed(2); clearInterval(timer); timer=setInterval(()=>{ if(!playing) return; mul+=0.02+mul*0.015; pos+=0.6; document.getElementById('mult').innerText=mul.toFixed(2)+'x'; document.getElementById('plane').style.left=(10+pos*0.8)+'%'; document.getElementById('plane').style.bottom=(20+pos*0.6)+'%'; if(inBet){ document.getElementById('btn').innerText='CASHOUT $'+(betAmt*mul).toFixed(2); } if(mul>=crash){ playing=false; clearInterval(timer); document.getElementById('mult').innerText='CRASHED @ '+crash.toFixed(2)+'x'; document.getElementById('mult').style.color='red'; document.getElementById('stat').innerText='Crashed @ '+crash.toFixed(2)+'x'; document.getElementById('stat').style.color='red'; let h=document.getElementById('hist'); let sp=document.createElement('span'); sp.innerText=crash.toFixed(2)+'x'; sp.style.color=crash<2?'#ef4444':crash<5?'#22c55e':'#a855f7'; h.prepend(sp); if(inBet){ inBet=false; document.getElementById('btn').innerText='LOST - BET AGAIN'; document.getElementById('btn').style.background='#ef4444'; } setTimeout(newRound,3000); } },80); }
function doBet(){ if(!playing) return; if(!inBet){ if(bal<betAmt){ alert('Low balance!'); return; } bal-=betAmt; inBet=true; document.getElementById('btn').className='btn cash'; document.getElementById('btn').innerText='CASHOUT $'+(betAmt*mul).toFixed(2); } else { let win=betAmt*mul; bal+=win; inBet=false; document.getElementById('btn').className='btn bet'; document.getElementById('btn').innerText='WON $'+win.toFixed(2)+' - BAL $'+bal.toFixed(2); setTimeout(()=>{ document.getElementById('btn').innerText='BET $10 - BAL $'+bal.toFixed(2); },1500); } }
newRound();
</script>
</body>
</html>
