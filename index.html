<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNN Simulator</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.header{padding:10px;color:#ff0000;font-weight:bold;letter-spacing:2px;font-size:12px;border-bottom:1px solid #111}
.flew{margin-top:25px;letter-spacing:3px;font-size:13px}
.time{color:#ff3333;font-size:12px;margin-top:4px}
.circle{width:280px;height:280px;margin:20px auto;border-radius:50%;border:3px solid #ff0000;box-shadow:0 0 40px #ff0000, inset 0 0 40px #220000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1a0000,#000)}
.val{font-size:62px;color:#00ff88;font-weight:900;text-shadow:0 0 20px #00ff88}
.btn{width:88%;max-width:340px;background:#00ff66;color:#000;border:none;padding:16px;border-radius:30px;font-weight:900;font-size:16px;box-shadow:0 0 20px #00ff66;margin-top:20px}
.ready{color:#00ff88;font-size:12px;margin-top:12px}
.hist{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap;padding:0 10px}
.h{padding:5px 10px;border-radius:15px;background:#111;font-size:12px;color:#ff5555;border:1px solid #222}
.h.g{color:#00ff88}
.footer{font-size:9px;color:#444;margin-top:25px;padding:0 20px;line-height:1.4}
</style>
</head>
<body>
<div class="header">✈️ TNN AVIATOR SIMULATOR</div>
<div class="flew">FLEW AWAY</div>
<div class="time" id="time">03/10/2026 - SATURDAY</div>

<div class="circle"><div class="val" id="val">8.07x</div></div>

<button class="btn" onclick="gen()">GET SIMULATION</button>
<div class="ready">Simulator ready - generates random for fun</div>

<div class="hist" id="hist"></div>

<div class="footer">
Offline Crash Simulator for entertainment only.<br>
Not connected to BetPawa / Aviator. Does not predict real gambling.<br>
rader-nu.vercel.app - TNN
</div>

<script>
function updateTime(){
  let d=new Date();
  let day=d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
  let w=d.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase();
  document.getElementById('time').innerText=day+" - "+w+" - "+d.toLocaleTimeString();
}
function gen(){
  document.getElementById('val').innerText="...";
  setTimeout(()=>{
    let v=(Math.random()*15+1).toFixed(2);
    document.getElementById('val').innerText=v+"x";
    let h=document.getElementById('hist');
    let s=document.createElement('div');
    s.className='h'+(v>2?' g':''); s.innerText=v+"x";
    h.prepend(s);
    if(h.children.length>6) h.lastChild.remove();
  },600);
  updateTime();
}
updateTime();
setInterval(updateTime,1000);
let init=["1.45x","2.13x","1.27x","8.07x","2.86x","1.07x"];
let hh=document.getElementById('hist');
init.forEach(x=>{
  let d=document.createElement('div'); d.className='h'+(parseFloat(x)>2?' g':''); d.innerText=x; hh.appendChild(d);
});
</script>
</body>
</html>
