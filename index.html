<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F0F0F;color:#fff;font-family:Arial}
.wrap{max-width:380px;margin:0 auto;padding:20px}
label{font-size:13px;color:#aaa;margin:16px 0 8px 0;display:block}
.field{background:#1C1C1E;border:1px solid #2C2C2E;border-radius:12px;padding:14px 14px;display:flex;align-items:center;gap:10px}
.field input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:14px}
.field.active{border:1px solid #FF6444}
.field.orange{background:#FF6444;border-color:#FF6444}
.field.orange input{color:#000;font-weight:700}
.field.orange ::placeholder{color:#000}
.small{color:#777;font-size:12px}
.btn{background:#FF6444;color:#000
