<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockTrader PRO - TNN Style</title>
<style>
body{margin:0;background:#080a0e;color:#fff;font-family:Inter,Arial}
.top{display:flex;justify-content:space-between;padding:12px 20px;background:#12151c;border-bottom:1px solid #222}
.live{color:#00ff88;font-weight:bold}
.card{background:#12151c;border-radius:16px;margin:12px;padding:16px;border:1px solid #222}
.price{font-size:42px;font-weight:800;color:#00ff88}
.canvas{width:100%;height:160px;background:#0a0c10;border-radius:12px;margin:10px 0}
.row{display:flex;gap:8px;margin:8px 0}
.btn{flex:1;padding:16px;border-radius:12px;border:none;font-weight:800;font-size:16px;cursor:pointer}
.rise{background:#00c853;color:#fff} .fall{background:#ff3d00;color:#fff}
.even{background:#2962ff;color:#fff} .odd{background:#aa00ff;color:#fff}
input{width:100%;padding:12px;border-radius:10px;background:#0a0c10;border:1px solid #333;color:#fff;margin:6px 0}
.digits{display:flex;gap:4px;flex-wrap:wrap}
.d{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#1e222e;border-radius:8px;font-weight:bold}
.d.e{color:#00ff88;border:1px solid #00ff88} .d.o{color:#ff4444;border:1px solid #ff4444}
</style>
</head>
<body>
<div class="top">
<div><b>StockTrader</b> <span id="pHead">--.--</span> <span class="live">● LIVE</span></div>
<div>Demo: <span id="bal">$70.50</span></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between">
<span id="status">Connecting...</span>
<span id="mkt">Vol 50 (1s) - 1HZ50V</span>
</div>
<div class="price" id="price">--.--</div>
<canvas id="chart" class="canvas"></canvas>
<div class="digits" id="digitBar"></div>
<div>Last: <b id="last">-</b> | Tick: <span id="tickCount">0</span></div>
</div>

<div class="card">
<label>Stake ($)</label><input id="stake" type="number" value="10">
<div style="display:flex;justify-content:space-between;font-size:13px;color:#aaa">
<span>Payout if win:</span><span id="payout" style="color:#00ff88;font-weight:bold">$19.50</span>
</div>
<div class="row"><button class="btn rise" onclick="doTrade('Rise')">RISE ↑</button><button class="btn fall" onclick="doTrade('Fall')">FALL ↓</button></div>
<div class="row"><button class="btn even" onclick="doTrade('Even')">EVEN</button><button class="btn odd" onclick="doTrade('Odd')">ODD</button></div>
</div>

<div class="card" style="font-size:12px;color:#666">
App ID: 34yOYkbTRmBuYtPnZYFit | 2.5% markup | Partner HTS3659JWWVA | TNNBinary style LIVE
<br>Market: Synthetic Indices 24/7 | Expiry: 1s-5s | Fixed risk: Lose only stake
</div>

<script>
const APP_ID='34yOYkbTRmBuYtPnZYFit', SYMBOL='1HZ50V';
let ws, prices=[], lastPrice=0, ticks=0, balance=70.50;
const ctx=document.getElementById('chart').getContext('2d');
function drawChart(){
 ctx.clearRect(0,0,300,160);
 if(prices.length<2) return;
 ctx.beginPath(); ctx.strokeStyle='#00ff88'; ctx.lineWidth=2;
 const min=Math.min(...prices), max=Math.max(...prices), range=max-min||1;
 prices.forEach((p,i)=>{
  const x=(i/prices.length)*300;
  const y=150-((p-min)/range)*140;
  if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
 });
 ctx.stroke();
}
function connect(){
 document.getElementById('status').innerText='Connecting Deriv...';
 ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id='+APP_ID);
 ws.onopen=()=>ws.send(JSON.stringify({ticks:SYMBOL}));
 ws.onmessage=e=>{
  const d=JSON.parse(e.data);
  if(d.tick){
   lastPrice=d.tick.quote; ticks++;
   prices.push(lastPrice); if(prices.length>50) prices.shift();
   document.getElementById('price').innerText=lastPrice.toFixed(3);
   document.getElementById('pHead').innerText='$'+lastPrice.toFixed(2);
   document.getElementById('last').innerText=String(lastPrice).slice(-1);
   document.getElementById('tickCount').innerText=ticks;
   document.getElementById('status').innerText='● LIVE '+new Date().toLocaleTimeString();
   document.getElementById('status').style.color='#00ff88';
   const digit=parseInt(String(lastPrice).slice(-1));
   const bar=document.getElementById('digitBar');
   const el=document.createElement('div'); el.className='d '+(digit%2==0?'e':'o'); el.innerText=digit;
   bar.prepend(el); if(bar.children.length>15) bar.removeChild(bar.lastChild);
   drawChart();
   const stake=parseFloat(document.getElementById('stake').value)||10;
   document.getElementById('payout').innerText='$'+(stake*1.95).toFixed(2);
  }
 };
 ws.onclose=()=>{document.getElementById('status').innerText='Reconnecting...'; setTimeout(connect,2000);}
}
function doTrade(type){
 if(!lastPrice) return alert('Wait for LIVE price!');
 const digit=parseInt(String(lastPrice).slice(-1));
 let win=false;
 if(type=='Even') win=digit%2==0;
 if(type=='Odd') win=digit%2==1;
 if(type=='Rise') win=Math.random()>0.5; // demo for Rise/Fall - real uses contract buy
 if(type=='Fall') win=Math.random()>0.5;
 const stake=parseFloat(document.getElementById('stake').value)||10;
 if(win){ balance+=stake*0.95; alert(type+' WIN! +$'+(stake*0.95).toFixed(2)+' Digit: '+digit); }
 else { balance-=stake; alert(type+' LOSS! -$'+stake+' Digit: '+digit); }
 document.getElementById('bal').innerText='$'+balance.toFixed(2);
}
connect();
</script>
</body>
</html>
