<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Predictor Mockup</title>
<style>
  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', Courier, monospace;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .phone-mockup {
    width: 350px;
    background: #111;
    border: 8px solid #333;
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
    position: relative;
    overflow: hidden;
  }
  .warning-banner {
    background: #f00;
    color: #fff;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    border-radius: 5px;
    margin-bottom: 15px;
    font-family: sans-serif;
  }
  .header {
    text-align: center;
    font-size: 14px;
    border-bottom: 1px dashed #0f0;
    padding-bottom: 5px;
    margin-bottom: 15px;
    color: #0f0;
    text-transform: uppercase;
  }
  .signal-box {
    background: #1a0000;
    border: 1px solid #f00;
    padding: 15px;
    text-align: center;
    margin-bottom: 15px;
    border-radius: 8px;
  }
  .signal-text {
    font-size: 24px;
    font-weight: bold;
    color: #f00;
    text-shadow: 0 0 10px #f00;
  }
  .multiplier {
    font-size: 36px;
    color: #f00;
    margin-top: 5px;
  }
  .terminal {
    background: #000;
    border: 1px solid #0f0;
    padding: 10px;
    height: 180px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 15px;
  }
  .terminal p { margin: 2px 0; }
  .blink {
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  button {
    width: 100%;
    padding: 12px;
    background: #0f0;
    color: #000;
    border: none;
    font-weight: bold;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    text-transform: uppercase;
  }
  button:hover { background: #0c0; }
</style>
</head>
<body>

<div class="phone-mockup">
  <div class="warning-banner">⚠️ NO SHARING APP- REAL PREDICTOR</div>
  
  <div class="header">Aviator Predictor v4.0</div>
  
  <div class="signal-box" id="signalBox" style="display: none;">
    <div class="signal-text">FLEW AWAY</div>
    <div class="multiplier" id="multiplierDisplay">1.45x</div>
  </div>

  <div class="terminal" id="terminal">
    <p>> Initializing Aviator Predictor v4.0...</p>
    <p>> Connecting to game server...</p>
    <p>> Bypassing RNG algorithm...</p>
    <p>> Server seed detected: [ENCRYPTED]</p>
    <p>> Analyzing historical crash points...</p>
    <p>> Ready. Press Generate Signal.<span class="blink">_</span></p>
  </div>

  <button id="generateBtn">Get real Signal</button>
</div>

<script>
  const terminal = document.getElementById('terminal');
  const signalBox = document.getElementById('signalBox');
  const multiplierDisplay = document.getElementById('multiplierDisplay');
  const generateBtn = document.getElementById('generateBtn');

  const fakeLogs = [
    "> Connecting to game server...",
    "> Bypassing RNG algorithm...",
    "> Extracting server seed hash...",
    "> Analyzing previous 50 rounds...",
    "> Calculating probability matrix...",
    "> Signal generated!"
  ];

  let isGenerating = false;

  generateBtn.addEventListener('click', () => {
    if (isGenerating) return;
    isGenerating = true;
    signalBox.style.display = 'none';
    terminal.innerHTML = '<p>> Starting prediction sequence...<span class="blink">_</span></p>';
    
    let i = 0;
    const interval = setInterval(() => {
      if (i < fakeLogs.length) {
        const p = document.createElement('p');
        p.textContent = fakeLogs[i];
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
        i++;
      } else {
        clearInterval(interval);
        // Generate completely random, meaningless number
        const randomMultiplier = (Math.random() * 3 + 1).toFixed(2);
        multiplierDisplay.textContent = randomMultiplier + 'x';
        signalBox.style.display = 'block';
        
        const p = document.createElement('p');
        p.textContent = "> SIGNAL: FLY AWAY at " + randomMultiplier + "x";
        p.style.color = "#f00";
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
        isGenerating = false;
      }
    }, 600);
  });
</script>
</body>
</html>
