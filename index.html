<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RQP Trader</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;padding:20px;text-align:center}button{background:#00ff88;color:#000;padding:15px;width:100%;border:0;border-radius:12px;font-size:18px;font-weight:bold}input{padding:15px;border-radius:10px;border:0;width:80%;margin:10px;text-align:center;font-size:18px}.card{background:#111;padding:20px;border-radius:15px;margin-top:20px}</style>
</head>
<body>
<h1>💰 RQP STOCK TRADER</h1>
<div class="card">
<h2>Balance: $<span id="bal">0.00</span></h2>
<input id="amount" type="number" value="10">
<button onclick="depositFunds()">Deposit MPESA</button>
<p style="color:#888">0703689230</p>
</div>
<script>
let b=0;
async function depositFunds(){
 let a=document.getElementById('amount').value;
 let p="254703689230";
 if(!a)return alert('Enter amount');
 let btn=document.querySelector('button');
 btn.innerText='Sending...';
 try{
  let r=await fetch('/api/mpesa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:a,phone:p})});
  let d=await r.json();
  if(d.success){alert('✅ STK SENT to '+p);}else{alert('Test mode: Adding balance');}
  b+=Number(a);document.getElementById('bal').innerText=b.toFixed(2);
 }catch(e){b+=Number(a);document.getElementById('bal').innerText=b.toFixed(2);alert('Added $'+a+' for test');}
 btn.innerText='Deposit MPESA';
}
</script>
</body>
</html>
