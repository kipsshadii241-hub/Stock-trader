<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#111;color:white;padding:10px">
<h1>KQbinary - FIXED ✅</h1>
<h1 id="price" style="font-size:40px;color:orange">Connecting...</h1>
<h2 id="digit" style="font-size:30px">Last Digit: -</h2>
<div id="box" style="display:flex;gap:5px;margin:10px 0"></div>
<button onclick="doDep()" style="background:orange;color:black;padding:15px 30px;border-radius:20px;font-weight:bold;width:100%">DEPOSIT TEST</button>
<p id="log" style="margin-top:20px;color:gray">Log: starting...</p>
<script>
let sel=5;
function showDigits(last){
 document.getElementById('box').innerHTML='';
 for(let i=0;i<10;i++){
  document.getElementById('box').innerHTML+=`<div onclick="sel=${i}" style="width:35px;height:35px;background:${i==sel?'orange':'#333'};color:${i==sel?'black':'white'};display:flex;align-items:center;justify-content:center;border-radius:8px;border:${i==last?'3px solid white':''}">${i}</div>`;
 }
}
showDigits(-1);
const ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
ws.onopen=()=>{ ws.send(JSON.stringify({ticks:"R_10"})); document.getElementById('log').innerText='Connected to Deriv - waiting price...'; };
ws.onmessage=(e)=>{
 const d=JSON.parse(e.data);
 if(d.tick){
  const p=d.tick.quote;
  const last=parseInt(p.toString().slice(-1));
  document.getElementById('price').innerText='R_10: $'+p;
  document.getElementById('digit').innerText='Last Digit: '+last+' | Selected: '+sel;
  showDigits(last);
  document.getElementById('log').innerText='LIVE moving! Price: '+p;
 }
};
ws.onerror=()=>{ document.getElementById('log').innerText='Error - reload page'; };
async function doDep(){
 const phone=prompt('Phone 254...','254708374149');
 const amt=prompt('Amount','10');
 document.getElementById('log').innerText='Sending to /api/mpesa...';
 try{
  const r=await fetch('/api/mpesa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount:amt})});
  const j=await r.json();
  alert(JSON.stringify(j));
  document.getElementById('log').innerText='MPESA: '+JSON.stringify(j);
 }catch(e){ alert(e.message); }
}
</script></body></html>
