<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNN Aviator Simulator</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center}
.header{background:#ff0000;padding:12px;font-weight:bold;font-size:13px;letter-spacing:1px}
.logo{margin:20px auto;width:50px;height:50px;border:2px solid #ff0000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.graph{position:relative;width:90%;max-width:340px;height:200px;margin:10px auto;background:radial-gradient(circle at center,#1a0000 0%,#000 70%);border-radius:15px;overflow:hidden;border:1px solid #222}
.plane{position:absolute;right:20px;top:40px;font-size:28px;transform:rotate(-10deg)}
.line{position:absolute;bottom:20px;left:10px;width:85%;height:80px;background:linear-gradient(to top right,rgba(255,0,0,0.6),transparent);clip-path:polygon(0 100%,30% 80%,60% 40%,100% 0%,100% 100%);border-left:2px solid #ff4444;border-bottom:2px solid #ff4444}
.mult{font-size:48px;color:#ffaa00;font-weight:900;margin-top:50px;text-shadow:0 0 20px #ff4400}
.dots{display:flex;justify-content:center;gap:6px;margin:15px 0}
.dot{width:6px;height:6px;background:#333;border-radius:50%}
.dot.active{background:#ff0000}
.btn{background:#00ff66;color:#000;border:none;padding:14px 50px;border-radius:25px;font-weight:900;font-size:16px;margin:15px 0}
.box{width:90%;max-width:340px;margin:0 auto;border:1px solid #ff0000;border-radius:8px;overflow:hidden;font-size:11px}
.box1{background:#111;padding:6px}
.box2{background:#ff0000;padding:8px;color:#fff}
.small{color:#666;font-size:10px;margin-top:20px;padding:0 20px}
</style>
</head>
<body>
<div class="header">TNN AVIATOR SIMULATOR - FOR FUN</div>
<div class="logo">✈️</div>

<div class="graph">
<div class="line"></div>
<div class="plane">🛩️</div>
<div class="mult" id="mult">2.31x</div>
</div>

<div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<button class="btn" onclick="generate()">NEXT GAME</button>

<div class="box">
<div class="box1" id="time"></div>
<div class="box2">SIMULATOR MODE - ENTERTAINMENT ONLY<br>Does NOT predict real Aviator</div>
</div>

<div class="small">This is a visual simulator for entertainment. Aviator results are random and cannot be predicted. Play responsibly.</div>

<script>
function generate(){
 document.getElementById('mult').innerText="Connecting...";
 setTimeout(()=>{
   let v=(Math.random()*50+1).toFixed(2);
   document.getElementById('mult').innerText=v+"x";
 },800);
}
document.getElementById('time').innerText="SIM - "+new Date().toLocaleTimeString()+" - "+new Date().toLocaleDateString();
generate();
</script>
</body>
</html>
