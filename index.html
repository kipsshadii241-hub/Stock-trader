<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Trader KE - LIVE</title>
<style>
body{margin:0;background:#0b0e11;color:#fff;font-family:Arial}
.head{padding:14px;background:#151a21;font-weight:900;display:flex;justify-content:space-between}
.box{margin:10px;background:#1e2329;border-radius:12px;padding:10px}
.wa{background:#25D366;color:#fff;text-align:center;padding:14px;border-radius:10px;display:block;text-decoration:none;font-weight:900}
#tv{height:550px}
select{width:100%;padding:12px;border-radius:8px;background:#2a2e39;color:#fff;border:0;font-weight:700}
button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:900;margin-top:8px}
.buy{background:#0ecb81}.sell{background:#f6465d;color:#fff}
</style>
</head>
<body>
<div class="head"><span>Stock-trader KE</span><span style="color:#0ecb81">● LIVE TICKING</span></div>

<div class="box">
<select id="pair" onchange="changePair()">
<option value="BINANCE:BTCUSDT">BTC / USDT</option>
<option value="OANDA:XAUUSD">GOLD / USD</option>
<option value="FX:EURUSD">EUR / USD</option>
<option value="NASDAQ:TSLA">TESLA</option>
<option value="CAPITALCOM:US100">NAS100</option>
</select>
<a class="wa" style="margin-top:10px" href="https://wa.me/254703683230">💬 WhatsApp 0703 683230 - Chat to Trade Real</a>
</div>

<div class="box"><div id="tv"></div></div>

<div class="box">
<button class="buy" onclick="location.href='https://wa.me/254703683230?text=BUY%20NOW'">BUY</button>
<button class="sell" onclick="location.href='https://wa.me/254703683230?text=SELL%20NOW'">SELL</button>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let widget;
function loadChart(sym){
widget = new TradingView.widget({
"autosize":true,"symbol":sym,"interval":"1","timezone":"Africa/Nairobi","theme":"dark","style":"1","locale":"en","toolbar_bg":"#1e2329","enable_publishing":false,"hide_top_toolbar":false,"allow_symbol_change":true,"container_id":"tv"
});
}
function changePair(){loadChart(document.getElementById('pair').value)}
loadChart("BINANCE:BTCUSDT");
</script>
</body>
</html>
