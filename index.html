<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockTrader - Volatility 10 (1s)</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.header{display:flex;justify-content:space-between;padding:12px;background:#111;align-items:center}
.balance{color:#0f0;font-weight:bold;font-size:18px}
.deposit{background:#ff4444;color:#000;border:none;padding:10px 20px;border-radius:20px;font-weight:bold}
#chart{height:60vh;background:#111;margin:10px;border-radius:10px}
.trading{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:18px;border:none;border-radius:10px;font-weight:bold;font-size:18px}
.even{background:#0f0;color:#000}
.odd{background:#f00;color:#fff}
</style>
</head>
<body>
<div class="header">
<div>RQPtrade <span class="balance" id="bal">$70.50</span></div>
<button class="deposit" onclick="window.open('https://app.deriv.com/cashier/deposit?app_id=34yOYkbTRmBuYtPnZYFit')">Deposit</button>
</div>
<div style="text-align:center;padding:10px">
<h2>Volatility 10 (1s) Index</h2>
<p>Balance: <span id="bal2">$70.50</span></p>
</div>
<div id="chart">
<!-- TradingView will load here -->
<iframe src="https://tradingview.com" style="width:100%;height:100%;border:none;background:#111"></iframe>
</div>
<div class="trading">
<button class="btn even" onclick="trade('even')">Even</button>
<button class="btn odd" onclick="trade('odd')">Odd</button>
</div>
<p style="text-align:center;color:#888">Even/Odd trading - Live - App ID: 34yOYkbTRmBuYtPnZYFit (2.5% markup active)</p>

<script>
// Connect to Deriv with YOUR App ID and markup
const app_id = '34yOYkbTRmBuYtPnZYFit';
const ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id='+app_id);
ws.onopen = () => {
 ws.send(JSON.stringify({authorize: localStorage.getItem('token') || ''}));
 // subscribe to Volatility 10 1s
 ws.send(JSON.stringify({ticks: 'R_10', subscribe: 1}));
};
function trade(type){alert(type+' trade placed! Markup 2.5% will go to your wallet HTS3659JWWVA');}
</script>
</body>
</html>
