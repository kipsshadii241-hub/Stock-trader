<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TNN AVIATOR SIMULATOR</title>
<style>
body { background:#000; color:#fff; font-family:Arial; text-align:center; margin:0; padding:20px; }
.top { color:#ff0000; font-weight:bold; letter-spacing:2px; margin-top:20px; }
.circle { width:280px; height:280px; border:3px solid #ff0000; border-radius:50%; margin:30px auto; display:flex; align-items:center; justify-content:center; box-shadow:0 0 30px rgba(255,0,0,0.3); }
.mult { font-size:60px; color:#00ff88; font-weight:bold; text-shadow:0 0 10px #00ff88; }
.btn { background:#00ff88; color:#000; border:none; padding:18px 40px; border-radius:30px; font-size:18px; font-weight:bold; width:90%; max-width:300px; margin-top:20px; }
.history { margin-top:30px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.history span { background:#111; border:1px solid #333; padding:5px 10px; border-radius:15px; font-size:12px; }
.disclaimer { margin-top:40px; font-size:11px; color:#666; }
</style>
</head>
<body>

<div class="top">✈️ TNN AVIATOR SIMULATOR</div>
<div style="color:#666; font-size:12px; margin-top:5px;">FOR ENTERTAINMENT ONLY</div>
<div style="color:#ff4444; font-size:12px; margin-top:5px;" id="date"></div>

<div class="circle">
<div class="mult" id="mult">2.14x</div>
</div>

<button class="btn" onclick="generate()">START SIMULATION</button>

<div class="history" id="history"></div>

<div class="disclaimer">
This is a fun simulator. It does NOT predict real BetPawa or Aviator results.<br>
Play responsibly. For entertainment only.
</div>

<script>
const el = document.getElementById('mult');
const hist = document.getElementById('history');
document.getElementById('date').innerText = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' - SIMULATOR';

function generate(){
 let v = (Math.random()*10+1).toFixed(2);
 el.innerText = v+'x';
 let s = document.createElement('span');
 s.innerText = v+'x';
 s.style.color = v>2?'#00ff88':'#ff4444';
 hist.prepend(s);
 if(hist.children.length>14) hist.lastChild.remove();
}
generate();
</script>

</body>
</html>
