<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TNNbinary LIVE FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#05070a;color:#fff}
.header{display:flex;justify-content:space-between;padding:12px;background:#0e1218}
.tabs{display:flex;gap:8px;padding:10px;background:#0e1218}.tab{padding:8px 14px;border-radius:20px;background:#1a2332;cursor:pointer}.tab.active{background:#00e5ff;color:#000;font-weight:700}
.chart-wrap{background:#0e1218;margin:10px;border-radius:12px;padding:8px;border:1px solid #222;height:200px;position:relative}
#mainChart{width:100%;height:180px;display:block}
.digit-row{display:flex;justify-content:space-between;padding:10px;gap:2px}.d-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1a2332;border:2px solid #2a3545;font-weight:800;cursor:pointer}.d-circle.active{background:#00e5ff;color:#000}
.s-btn{background:#1a2332;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:20px;margin:4px;cursor:pointer;font-weight:700}.s-btn.active{background:#00e5ff;color:#000}
.t-btn{flex:1;padding:16px;border-radius:12px;border:none;font-weight:900;color:#fff;cursor:pointer;font-size:16px}.t-even{background:#00c853}.t-odd{background:#aa00ff}
.trade-row{display:flex;gap:10px;padding:12px}
</style></head><body>
<div class="header"><div><b>TNNbinary</b> ● <span id="bal">$70.50</span></div><div><span id="bal2">$70.50</span> <button style="background:#00e5ff;padding:6px 14px;border-radius:20px;border:none;font-weight:800">Deposit</button></div></div>
<div class="tabs"><div class="tab" onclick="switchTab(this)">Matches/Differs</div><div class="tab active" onclick="switchTab(this)">Even/Odd</div><div class="tab" onclick="switchTab(this)">Over/Under</div></div>
<div style="padding:12px;display:flex;justify-content:space-between"><div>Volatility 10 (1s) Index<br><small id="status" style="color:#00ff88">● LIVE Connecting...</small></div><div id="priceBig" style="font-size:20px;font-weight:800">9450.83</div></div>
<div class="chart-wrap"><canvas id="mainChart"></canvas></div>
<div class="digit-row" id="digitRow"></div>
<div style="padding:10px">STAKE <b id="stakeDisplay">$ 10</b></div>
<div style="padding:0 10px"><button class="s-btn" onclick="setStake(1)">$1</button><button class="s-btn" onclick="setStake(5)">$5</button><button class="s-btn active" onclick="setStake(10)">$10</button><button class="s-btn" onclick="setStake(25)">$25</button><button class="s-btn" onclick="setStake(50)">$50</button></div>
<div class="trade-row"><button class="t-btn t-even" onclick="trade('Even')"><div>Even</div><small id="evenPay">95.20% $19.52</small></button><button class="t-btn t-odd" onclick="trade('Odd')"><div>Odd</div><small id="oddPay">95.20% $19.52</small></button></div>
<script>
let stake=10,balance=70.50,prices=[],digitCounts=Array(10).fill(0),totalTicks=0,lastDigit=3,lastPrice=9450.83;
const canvas=document.getElementById('mainChart'),ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.offsetWidth;canvas.height=180}window.addEventListener('load',resize);resize();
function draw(){ctx.clearRect(0,0,canvas.width,180);if(prices.length<2)return;ctx.beginPath();ctx.strokeStyle='#00e5ff';ctx.lineWidth=2;prices.forEach((p,i)=>{const x=(i/(prices.length-1))*canvas.width;const min=Math.min(...prices),max=Math.max(...prices);const y=160-((p-min)/(max-min||1))*140;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}
function updateDigits(){const row=document.getElementById('digitRow');row.innerHTML='';for(let i=0;i<10;i++){const perc=totalTicks?((digitCounts[i]/totalTicks)*100).toFixed(1):(8+Math.random()*4).toFixed(1);row.innerHTML+=`<div style="text-align:center;flex:1"><div class="d-circle ${i==lastDigit?'active':''}" onclick="pickDigit(${i})">${i}</div><div style="font-size:10px;color:#888">${perc}%</div></div>`}}
function setStake(v){stake=v;document.getElementById('stakeDisplay').innerText='$ '+v;document.querySelectorAll('.s-btn').forEach(b=>b.classList.toggle('active',b.innerText=='$'+v));const pay=(v*1.952).toFixed(2);document.getElementById('evenPay').innerText='95.20% $'+pay;document.getElementById('oddPay').innerText='95.20% $'+pay}
function pickDigit(d){lastDigit=d;updateDigits()}
function switchTab(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}
function trade(type){const win=(type=='Even'&&lastDigit%2==0)||(type=='Odd'&&lastDigit%2==1);if(win){balance+=stake*0.952;alert('WIN! '+type+' Digit '+lastDigit+' +$'+(stake*0.952).toFixed(2))}else{alert('LOSS! '+type+' Digit '+lastDigit+' -$'+stake);balance-=stake}document.getElementById('bal').innerText='$'+balance.toFixed(2);document.getElementById('bal2').innerText='$'+balance.toFixed(2)}
// LIVE TICK - With fallback so it ALWAYS moves even if Deriv fails
function newTick(price){lastPrice=price;lastDigit=parseInt(String(price).slice(-1));totalTicks++;digitCounts[lastDigit]++;prices.push(price);if(prices.length>60)prices.shift();document.getElementById('priceBig').innerText=price.toFixed(2);document.getElementById('status').innerText='● LIVE '+new Date().toLocaleTimeString();document.getElementById('status').style.color='#00ff88';draw();updateDigits()}
let ws;function connect(){try{ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');ws.onopen=()=>{document.getElementById('status').innerText='● LIVE Connected';ws.send(JSON.stringify({ticks:'R_10'}))};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.tick)newTick(d.tick.quote)};ws.onerror=()=>startFake();ws.onclose=()=>setTimeout(connect,3000)}catch(e){startFake()}}
function startFake(){document.getElementById('status').innerText='● LIVE DEMO (Fallback)';let p=9450;setInterval(()=>{p+= (Math.random()-0.5)*2;newTick(p)},800)}
// Try real first, fallback to moving demo after 3 sec
connect();setTimeout(()=>{if(totalTicks==0)startFake()},3000);
setStake(10);updateDigits();
</script></body></html>
