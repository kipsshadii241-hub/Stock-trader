<script>
async function depositFunds(){
  const amountInput = document.querySelector('input[type="number"]');
  const amount = amountInput ? amountInput.value : 10;
  const phone = "254703689230";
  if(!amount) return alert('Enter amount');
  try{
    const res = await fetch('/api/mpesa',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({amount:amount, phone:phone})
    });
    const data = await res.json();
    if(data.success){
      alert('✅ STK PUSH SENT to '+phone+'! Check phone and enter PIN!');
    }else{
      alert('❌ Failed: '+(data.error||'Try again'));
    }
  }catch(err){
    alert('Error: '+err.message);
  }
}
</script>
